<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qypees Terminal | V.2.0 Pro Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #07090e; color: white; overflow: hidden; margin: 0; }
        
        /* Tam Sayfayı Kaplayan Canlı Grafik Kanvası */
        #chartCanvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.25; pointer-events: none;
        }

        .crypto-bg {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(19,27,46,0.8) 0%, rgba(7,9,14,0.95) 100%);
            z-index: 2;
        }

        .content-layer { position: relative; z-index: 10; }

        .version-badge {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        .crypto-title { text-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }

        .trade-btn {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            box-shadow: 0 4px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .trade-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 35px rgba(16, 185, 129, 0.7);
            background: linear-gradient(135deg, #34D399 0%, #10B981 100%);
        }

        .fade-out { animation: fadeOutAnim 0.5s forwards; }
        @keyframes fadeOutAnim {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.95); filter: blur(10px); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center cursor-pointer select-none" onclick="girisYap()">

    <!-- Arkada Akan Canlı Borsa / Grafik Efekti -->
    <canvas id="chartCanvas"></canvas>
    <div class="crypto-bg"></div>

    <div id="main-container" class="content-layer flex flex-col items-center text-center p-8 max-w-xl">
        
        <!-- Sürüm Rozeti -->
        <div class="version-badge px-4 py-1.5 rounded-full flex items-center gap-2 mb-6">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-xs font-bold tracking-widest text-emerald-400 uppercase">Qypees Terminal V.2.0 • Pro Trading</span>
        </div>

        <!-- Başlık -->
        <h1 class="crypto-title text-4xl md:text-6xl font-black tracking-tight mb-3">
            Qypees <span class="text-emerald-400">Terminal</span>
        </h1>
        <p class="text-gray-400 text-xs md:text-sm tracking-wider mb-8 font-medium">
            Kurumsal Kripto İstihbarat, Portföy Takibi & Algoritmik Sinyal Merkezi
        </p>

        <!-- Canlı Piyasa Özet Kartı -->
        <div class="w-full bg-[#131b2e]/90 backdrop-blur-md border border-gray-800 p-5 rounded-2xl mb-8 text-left shadow-2xl">
            <div class="flex justify-between items-center mb-3 border-b border-gray-800/80 pb-2">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Sistem Durumu</span>
                <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20">● Canlı Akış Aktif</span>
            </div>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-[#07090e] p-3 rounded-xl border border-gray-800/50">
                    <div class="text-[10px] text-gray-500 uppercase">Veritabanı</div>
                    <div class="text-sm font-bold text-white mt-0.5">100 Coin</div>
                </div>
                <div class="bg-[#07090e] p-3 rounded-xl border border-gray-800/50">
                    <div class="text-[10px] text-gray-500 uppercase">Analiz Ajanı</div>
                    <div class="text-sm font-bold text-emerald-400 mt-0.5">Aktif 🟢</div>
                </div>
                <div class="bg-[#07090e] p-3 rounded-xl border border-gray-800/50">
                    <div class="text-[10px] text-gray-500 uppercase">Sinyal Oranı</div>
                    <div class="text-sm font-bold text-blue-400 mt-0.5">%94.2</div>
                </div>
            </div>
        </div>

        <!-- Giriş Butonu -->
        <div class="trade-btn w-full text-white font-bold py-4 rounded-xl text-sm md:text-base tracking-wider uppercase text-center shadow-lg">
            Sisteme Giriş Yap ve Piyasayı Takip Et →
        </div>
        
    </div>

    <!-- Arkadaki Canlı Grafik Animasyon Scripti -->
    <script>
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let points = [];
        let numPoints = 60;
        let step = canvas.width / numPoints;
        let currentY = canvas.height / 2;

        for (let i = 0; i <= numPoints; i++) {
            currentY += (Math.random() - 0.48) * 40;
            points.push({ x: i * step, y: currentY });
        }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Yeni veri noktası kaydır
            points.shift();
            for (let i = 0; i < points.length; i++) {
                points[i].x = i * (canvas.width / numPoints);
            }
            let lastY = points[points.length - 1].y;
            let nextY = lastY + (Math.random() - 0.49) * 45;
            if (nextY > canvas.height - 100) nextY = canvas.height - 100;
            if (nextY < 100) nextY = 100;
            points.push({ x: canvas.width, y: nextY });

            // Gradient Alan Çizimi (Yeşil Boğa Dalgası)
            ctx.beginPath();
            ctx.moveTo(points[0].x, canvas.height);
            for (let i = 0; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();

            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(16, 185, 129, 0.35)');
            gradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Ana Fiyat Çizgisi
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                if (i === 0) ctx.moveTo(points[i].x, points[i].y);
                else ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.strokeStyle = '#10B981';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Rastgele Mum Fitilleri ve Kutuları (Fantastik Detay)
            for (let i = 0; i < points.length; i += 3) {
                let p = points[i];
                let isGreen = Math.random() > 0.3;
                ctx.strokeStyle = isGreen ? 'rgba(16, 185, 129, 0.5)' : 'rgba(239, 68, 68, 0.5)';
                ctx.fillStyle = ctx.strokeStyle;
                ctx.lineWidth = 1.5;

                // Fitil
                ctx.beginPath();
                ctx.moveTo(p.x, p.y - 25);
                ctx.lineTo(p.x, p.y + 25);
                ctx.stroke();

                // Mum Gövdesi
                ctx.fillRect(p.x - 4, p.y - 12, 8, 24);
            }
        }

        setInterval(drawChart, 70);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            step = canvas.width / numPoints;
        });

        function girisYap() {
            const container = document.getElementById('main-container');
            container.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = '/disclaimer';
            }, 450);
        }
    </script>
</body>
</html>
