<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qypees Terminal Pro | Über HFT Engine Boot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #010102; 
            color: #ffffff; 
            overflow: hidden; 
            margin: 0; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cyber-text { font-family: 'JetBrains Mono', monospace; }

        /* Gelişmiş Arka Plan ve Kanvas */
        #chartCanvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.15; pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.2));
        }

        .crypto-bg {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.05) 0%, rgba(1, 1, 2, 1) 90%);
            z-index: 2; pointer-events: none;
        }

        .grid-bg { 
            position: fixed; inset: 0; 
            background-image: linear-gradient(rgba(0, 255, 204, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.02) 1px, transparent 1px); 
            background-size: 30px 30px; z-index: 3; pointer-events: none; 
        }

        .scanline { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); 
            background-size: 100% 4px; pointer-events: none; z-index: 50; opacity: 0.4; 
        }

        /* Neomorphic Glassmorphism Kart Yapısı */
        .glass-panel {
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-top: 1px solid rgba(0, 255, 204, 0.4);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(0,255,204,0.1);
            border-radius: 16px;
            position: relative;
            z-index: 10;
        }

        .crypto-title { 
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.4); 
            letter-spacing: -0.02em;
        }

        /* Yüksek Kaliteli Buton */
        .trade-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #047857 100%);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            color: #010102;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            opacity: 0.4;
            pointer-events: none;
            border: 1px solid #00ffcc;
            cursor: pointer;
        }
        
        .trade-btn.active {
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
        }

        .trade-btn.active:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 40px -10px rgba(0, 255, 204, 0.8);
        }

        /* Terminal Konsol Ekranı */
        .terminal-box {
            background: #020304;
            border: 1px solid rgba(0, 255, 204, 0.1);
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
            height: 280px;
            overflow-y: hidden;
            position: relative;
        }

        .terminal-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 100%;
            padding: 10px;
        }

        .log-line {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-bottom: 2px;
            animation: slideUp 0.1s ease-out forwards;
        }

        .log-prefix { color: #00ffcc; font-weight: bold; }
        .log-success { color: #10b981; }
        .log-warn { color: #f59e0b; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Progress Bar */
        .progress-container { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 15px; }
        .progress-bar { height: 100%; width: 0%; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; transition: width 0.1s linear; }

        /* Sayfa Geçiş Efekti */
        .fade-out { animation: fadeOutAnim 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeOutAnim {
            0% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
        }
    </style>
</head>
<body>

    <canvas id="chartCanvas"></canvas>
    <div class="crypto-bg"></div>
    <div class="grid-bg"></div>
    <div class="scanline"></div>

    <div id="main-container" class="glass-panel w-full max-w-3xl flex flex-col p-6 md:p-8 relative">
        
        <!-- Üst Header: Sistem Bilgisi -->
        <div class="flex justify-between items-start border-b border-white/10 pb-4 mb-6">
            <div>
                <h1 class="crypto-title text-2xl md:text-4xl font-black cyber-text tracking-widest">
                    QYPEES <span class="text-[#00ffcc]">TERMINAL PRO</span>
                </h1>
                <p class="text-gray-400 text-[10px] uppercase tracking-[0.3em] mt-1 cyber-text font-bold">
                    [ÜBER HFT ENGINE]
                </p>
            </div>
            <div class="text-right flex flex-col items-end gap-1">
                <span class="bg-[#00ffcc]/10 border border-[#00ffcc]/30 text-[#00ffcc] text-[9px] px-2 py-0.5 rounded font-black cyber-text tracking-widest uppercase shadow-[0_0_10px_rgba(0,255,204,0.2)]">
                    FASTAPI CORE V4.2
                </span>
                <span class="text-gray-500 text-[8px] cyber-text font-bold uppercase">
                    Node: ISTANBUL-01
                </span>
            </div>
        </div>

        <!-- Terminal Log Ekranı (100 Özellik Yükleniyor) -->
        <div class="terminal-box cyber-text mb-2">
            <div id="terminal-content" class="terminal-content">
                <!-- Javascript ile 100 satır buraya akacak -->
            </div>
        </div>

        <!-- Yükleme Çubuğu ve Yüzde -->
        <div class="flex justify-between items-center text-[10px] cyber-text font-bold text-[#00ffcc] mt-2 px-1">
            <span id="loading-status">SİSTEM ÖNYÜKLEMESİ BAŞLATILIYOR...</span>
            <span id="loading-percent">0%</span>
        </div>
        <div class="progress-container mb-6">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <!-- Giriş Butonu -->
        <button id="enter-btn" onclick="girisYap()" class="trade-btn w-full font-black py-4 rounded-xl text-xs md:text-sm tracking-[0.2em] uppercase cyber-text flex justify-center items-center gap-2">
            <span id="btn-text">MODÜLLERİN YÜKLENMESİ BEKLENİYOR...</span>
        </button>
        
    </div>

    <script>

            "Hayalet (Stealth) Modu Kullanıcı Arayüzü Maskeleme Yüklendi.",

            "Terminal Oturumu Başına Tek Kullanımlık Şifre (OTP) Üretici Hazır.",
            "Donanım Cüzdanı (Cold Wallet) İzole Okuma Modülü Bağlandı.",
            "Ağ Trafiği Şifrelemesi (TLS 1.3) Zorunlu Kılındı.",
            "Sistem Kendini İmha (Nuke/Panic) Prosedürü Beklemeye Alındı.",

            // Market Data & Order Book (21-40)
            "Binance L2 & L3 Order Book (Emir Defteri) Derinlik Akışı Başlatıldı.",

            "Order Flow Imbalance (OFI - Emir Akışı Dengesizliği) Hesaplayıcı Aktif.",

            "Spoofing (Sahte Emir) ve Katmanlama (Layering) Dedektörü Çalışıyor.",
            "Iceberg (Buzdağı) Kurumsal Emir Yakalama Sensörleri Aktif.",

            "Tasfiye (Liquidation) Şelalesi Erken Uyarı Sistemi Başlatıldı.",

            "Zaman ve Satış (Time & Sales) Mikro-Yapı Anomalisi Taranıyor.",
            "Gecikme (Latency) Arbitrajı Fırsat Bulucu Sensörleri Açıldı.",
            "Bid/Ask Duvarı Aşınma İndeksi Veritabanına Bağlandı.",
            "Piyasa Yapıcı (Market Maker) Çekilme (Dry-up) Tespiti Aktif.",
            "Flaş Çöküş (Flash Crash) Koruması Derinlik Analizine Başladı.",
            "Emir Gerçekleşme (Fulfillment) ve İptal (Cancel) Rasyosu Ölçülüyor.",

            // AI, NLP & Sentiment (41-60)
            "LSTM Nöral Ağ Fiyat Yörünge Projeksiyonu Eğitildi.",
            "Doğal Dil İşleme (NLP) Haber Ayrıştırma Motoru Çevrimiçi.",
            "SEC EDGAR Veritabanı Gerçek Zamanlı Sızıntı Kazıyıcı Aktif.",
            "X/Twitter Kurumsal Balina Duygu (Sentiment) Analizi Başlatıldı.",
            "FOMC FED Tutanakları Şahin/Güvercin Puanlama Yapay Zekası Hazır.",
            "Söylenti vs Gerçek (Rumor vs Fact) Kuantum Filtresi Devrede.",
            "Deep-Fake (Yanıltıcı) Haber İzolasyon ve Doğrulama Ağı Aktif.",
            "Bireysel FOMO ve Panik Metrikleri (Fear & Greed) Güncelleniyor.",
            "Akıllı Para (Smart Money) Niyet Skoru Hesaplayıcısı Yüklendi.",
            "VADER Makro Haber Etkisi ve Şok Dalgası Sınıflandırıcısı Başlatıldı.",
            "Markov Rejim Değişikliği (Boğa/Ayı/Yatay) Tespit Modülü Aktif.",
            "Monte Carlo Risk ve Hayatta Kalma (Survival) Simülatörü Hazır.",
            "K-Means Kümeleme ile Dinamik Destek/Direnç Çizici Yüklendi.",
            "Derin Pekiştirmeli Öğrenme (RL) Sinyal Optimizasyonu Devrede.",
            "Otokorelasyon ve Trend Devamlılık (Hurst Üssü) Motoru Açıldı.",
            "Z-Score (Standart Sapma) Anomalisi Arama Botu Çalışıyor.",
            "Fourier Dönüşümü ile Döngüsel Fiyat Hareket Analizi Başlatıldı.",
            "Telegram/Discord Alpha Kanalları VIP Sızıntı Dedektörü Aktif.",
            "Sarcasm (İroni) ve Kinaye Anlayan Gelişmiş NLP Katmanı Yüklendi.",
            "GitHub Geliştirici Kod Gönderim (Commit) Aktivite Sensörü Hazır.",

            // On-Chain & Cross-Asset Macro (61-80)
            "Madenci Teslimiyeti (Miner Capitulation) On-Chain Verisi Çekiliyor.",
            "Borsa Net Para Giriş/Çıkış (Inflow/Outflow) Akışı Bağlandı.",
            "Uyuyan Balina Uyanışı ve Cüzdan Kümeleme Radarı Aktif.",
            "Stablecoin (USDT/USDC) Basım (Mint) ve Yakım (Burn) Isısı Ölçülüyor.",
            "MVRV Z-Score Uzun Vade Dip/Tepe Kesişimi Hesaplanıyor.",
            "L2 Sequencer Darboğaz ve TVL (Kilitli Varlık) Kayması Taranıyor.",
            "Akıllı Kontrat Exploit (Hack) Sinyali Siyah Kuğu Ağına Bağlandı.",
            "Token Kilit Açılımı (Unlock) Fiyat Baskılama Beklentisi Yüklendi.",
            "DXY (Dolar Endeksi) ve Kripto Ters Korelasyon İndeksi Aktif.",
            "US10Y (Tahvil) Faiz Şoku Piyasa Duyarlılık Ölçer Hazır.",
            "S&P 500 (SPX) ve Nasdaq (NDX) Eşzamanlı Beta Katsayısı Hesaplanıyor.",
            "Altın (XAU) / Kripto Güvenli Liman Geçiş (Rotation) Radarı Açıldı.",
            "Makro Ekonomik (TÜFE/ÜFE) Beklenti Sapma Motoru Yüklendi.",
            "Sektörel Sermaye Rotasyonu (DeFi -> AI -> Meme) Takibi Aktif.",
            "Çapraz Borsa (Cross-Exchange) Arbitraj Spread Boşluğu Taranıyor.",
            "Airdrop Talep (Claim) Satış Baskısı Erken Uyarı Sistemi Hazır.",
            "Likit Restaking (LRT) Sentetik Sabitlik Kırılması Dedektörü Devrede.",
            "Sürekli Vadeli (Perp) Premium vs Spot Fiyat Uyumsuzluğu Ölçülüyor.",
            "Opsiyon Maksimum Acı (Max Pain) Seviyesi Mıknatıs Etkisi Analiz Ediliyor.",
            "EIP-1559 Base Fee Tıkanıklık ve Gas Ücreti Sansür Direnci Aktif.",

            // HFT Execution & Cognitive Focus (81-100)
            "Ping-Pong HFT Kotasyon Dizilim Algoritması Beklemede.",
            "Keskin Nişancı (Sniper) Limit Emir Kovalamaca Modülü Yüklendi.",
            "Gelişmiş SOR (Smart Order Routing) Çoklu Borsa Dağıtıcısı Hazır.",
            "Maksimum Drawdown (MDD) Nükleer Devre Kesici Kalkanı Aktif.",
            "Çaprazdan (Cross) İzole Marjine Dinamik Geçiş Sistemi Yüklendi.",
            "Fonlama Ücreti (Funding Fee) Hasat Çiftliği Sensörleri Açıldı.",
            "Saniye Altı (Sub-Second) Tick Scalper Motoru Devreye Girdi.",
            "Ortalama Dönüş (Mean Reversion) Flaş İşlem Algoritması Hazır.",
            "İstatistiksel Eşbütünleşme (Pair Trade) Fırsat Bulucu Çalışıyor.",
            "Post-Trade Psikolojik Teşhis ve Tilt Metre Sensörü Aktif.",
            "Web Audio API Nöro-Akustik (Cognitive Focus) Ses Motoru Bağlandı.",
            "Beta (14Hz) Binaural Odak Frekans Sentezleyicisi Yüklendi.",
            "Piyasa Volatilitesi ile Senkronize Otonom Gürültü Maskeleyici Aktif.",
            "İntikam İşlemi (Revenge Trade) ve FOMO Tespit Yapay Zekası Devrede.",
            "Kâr Çarpanı (Profit Factor) ve Kelly Kriteri Optimizatörü Yüklendi.",
            "Dinamik ATR Tabanlı Trailing Stop (İz Süren Stop) Mekanizması Hazır.",
            "Sıfır Kayma (Zero-Slippage) Piyasa Emülatörü Test Edildi.",
            "Adil Değer (Fair Value) Prim Deflasyonu Hesaplaması Tamamlandı.",
            "Tüm Modüller Çapraz Kontrolden Geçti. Kuantum Hata Ayıklama Temiz.",
            "SİSTEM HAZIR: İSTANBUL DÜĞÜMÜ KULLANICI İNFAZI BEKLİYOR."
        ];

        const terminalContent = document.getElementById('terminal-content');
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('loading-percent');
        const statusText = document.getElementById('loading-status');
        const enterBtn = document.getElementById('enter-btn');
        const btnText = document.getElementById('btn-text');

        let currentLine = 0;
        const totalLines = bootSequence.length;

        function appendLog() {
            if (currentLine < totalLines) {
                const text = bootSequence[currentLine];
                const p = document.createElement('div');
                p.className = 'log-line';
                
                let prefix = "SYS";
                let colorClass = "";
                
                if (text.includes("Aktif") || text.includes("Çalışıyor") || text.includes("Temiz") || text.includes("Hazır") || text.includes("HAZIR")) {
                    colorClass = "log-success";
                } else if (text.includes("Beklemede") || text.includes("Taranıyor") || text.includes("Bağlanıyor")) {
                    colorClass = "log-warn";
                } else if (text.includes("FastAPI") || text.includes("PostgreSQL")) {
                    prefix = "CORE";
                } else if (text.includes("HFT") || text.includes("Arbitraj")) {
                    prefix = "QUANT";
                } else if (text.includes("NLP") || text.includes("Yapay Zeka")) {
                    prefix = "AI";
                }

                p.innerHTML = `<span class="log-prefix">[${prefix}]</span> <span class="${colorClass}">${text}</span>`;
                terminalContent.appendChild(p);

                if(terminalContent.children.length > 15) {
                    terminalContent.removeChild(terminalContent.firstChild);
                }

                const progress = Math.floor(((currentLine + 1) / totalLines) * 100);
                progressBar.style.width = `${progress}%`;
                percentText.innerText = `${progress}%`;
                
                if(currentLine % 10 === 0 && currentLine !== 0) {
                    statusText.innerText = `MODÜLLER YÜKLENİYOR... SEVİYE ${currentLine/10}`;
                }

                currentLine++;
                
                const delay = Math.random() * 40 + 10; 
                setTimeout(appendLog, delay);
            } else {
                statusText.innerText = "TÜM SİSTEMLER OPERASYONEL.";
                statusText.style.color = "#10b981";
                btnText.innerHTML = "Q-AI ÇEKİRDEĞİNE GİRİŞ YAP ➔";
                enterBtn.classList.add('active');
            }
        }

        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        let numPoints = 120;
        let step;
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            step = canvas.width / numPoints;
            points = [];
            let currentY = canvas.height / 2;
            for (let i = 0; i <= numPoints; i++) {
                currentY += (Math.random() - 0.5) * 60;
                points.push({ x: i * step, y: currentY });
            }
        }
        initCanvas();

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            points.shift();
            for (let i = 0; i < points.length; i++) {
                points[i].x = i * step;
            }
            
            let lastY = points[points.length - 1].y;
            let nextY = lastY + (Math.random() - 0.5) * 70;
            if (nextY > canvas.height - 100) nextY = canvas.height - 100;
            if (nextY < 100) nextY = 100;
            points.push({ x: canvas.width, y: nextY });

            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                if (i === 0) ctx.moveTo(points[i].x, points[i].y);
                else ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.4)';
            ctx.lineWidth = 1;
            ctx.stroke();

            for (let i = 0; i < points.length; i += 2) {
                let p = points[i];
                let isBuy = Math.random() > 0.5;
                ctx.fillStyle = isBuy ? 'rgba(0, 255, 204, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                let volHeight = Math.random() * 80;
                ctx.fillRect(p.x, canvas.height - volHeight, step * 1.5, volHeight);
            }
        }
        setInterval(drawChart, 30);

        window.addEventListener('resize', initCanvas);

        // Sayfa Giriş Yönlendirmesi (/onayla rotasına yönlendirerek çerez sorununu çözer)
        function girisYap() {
            const container = document.getElementById('main-container');
            container.classList.add('fade-out');
            
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, actx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.1);
                osc.start();
                osc.stop(actx.currentTime + 0.1);
            } catch(e) {}

            setTimeout(() => {
                window.location.href = '/onayla'; // Oturum çerezini yazacak rotaya bağlanır
            }, 500);
        }

        setTimeout(appendLog, 500);

    </script>
</body>
</html>
