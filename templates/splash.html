<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qypees Terminal | V.2.1 Pro Trading Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030407; 
            color: #ffffff; 
            overflow: hidden; 
            margin: 0; 
        }
        
        /* Gelişmiş Arka Plan ve Kanvas */
        #chartCanvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 1; opacity: 0.35; pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.2));
        }

        .crypto-bg {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(3, 4, 7, 0.98) 80%);
            z-index: 2;
        }

        /* Neomorphic Glassmorphism Kart Yapısı */
        .glass-panel {
            background: rgba(10, 15, 26, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius: 24px;
        }

        .content-layer { position: relative; z-index: 10; }

        /* Rozet ve Metin Parlamaları */
        .version-badge {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }

        .crypto-title { 
            text-shadow: 0 0 45px rgba(0, 255, 204, 0.3); 
            letter-spacing: -0.03em;
        }

        /* Yüksek Kaliteli Buton */
        .trade-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #00ccaa 100%);
            box-shadow: 0 10px 30px -10px rgba(0, 255, 204, 0.5);
            color: #030407;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        
        .trade-btn::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.6s ease;
        }

        .trade-btn:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 15px 40px -10px rgba(0, 255, 204, 0.7);
        }
        
        .trade-btn:hover::after { left: 200%; }

        /* Sayfa Geçiş Efekti */
        .fade-out { animation: fadeOutAnim 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeOutAnim {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.97) translateY(-20px); filter: blur(12px); }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center cursor-pointer select-none" onclick="girisYap()">

    <!-- Arkada Akan Dinamik Grafik -->
    <canvas id="chartCanvas"></canvas>
    <div class="crypto-bg"></div>

    <div id="main-container" class="content-layer flex flex-col items-center text-center p-6 md:p-10 max-w-2xl w-full">
        
        <!-- Sürüm Rozeti -->
        <div class="version-badge px-5 py-2 rounded-full flex items-center gap-3 mb-8 transition-transform hover:scale-105">
            <span class="relative flex h-2.5 w-2.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#00ffcc] opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#00ffcc]"></span>
            </span>
            <span class="text-xs font-black tracking-[0.2em] text-[#00ffcc] uppercase">Qypees Terminal V.2.1 • Pro</span>
        </div>

        <!-- Başlık -->
        <h1 class="crypto-title text-5xl md:text-7xl font-black mb-4">
            Qypees <span class="text-[#00ffcc]">Terminal</span>
        </h1>
        <p class="text-gray-400 text-sm md:text-base tracking-wide mb-10 font-light max-w-lg leading-relaxed">
            %100 Gerçek Zamanlı Kripto İstihbarat, Canlı Veri İstasyonu ve Karar Destek Merkezi.
        </p>

        <!-- Glassmorphism Sistem Kartı -->
        <div class="w-full glass-panel p-6 md:p-8 mb-10 text-left">
            <div class="flex justify-between items-center mb-5 border-b border-white/5 pb-4">
                <span class="text-xs font-black text-gray-500 uppercase tracking-widest">Çekirdek Sistem Durumu</span>
                <span class="text-xs font-black text-[#00ffcc] bg-[#00ffcc]/5 px-3 py-1.5 rounded border border-[#00ffcc]/20 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#00ffcc]"></span> Canlı Akış Aktif
                </span>
            </div>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-[#030407]/60 p-4 rounded-xl border border-white/5 transition-colors hover:bg-[#030407]/80">
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Veritabanı</div>
                    <div class="text-sm md:text-base font-black text-white mt-1.5">200 Coin</div>
                </div>
                <div class="bg-[#030407]/60 p-4 rounded-xl border border-white/5 transition-colors hover:bg-[#030407]/80">
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Analiz Motoru</div>
                    <div class="text-sm md:text-base font-black text-[#00ffcc] mt-1.5">Aktif 🟢</div>
                </div>
                <div class="bg-[#030407]/60 p-4 rounded-xl border border-white/5 transition-colors hover:bg-[#030407]/80">
                    <div class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Veri Akışı</div>
                    <div class="text-sm md:text-base font-black text-blue-400 mt-1.5">%100 Gerçek</div>
                </div>
            </div>
        </div>

        <!-- Yüksek Tepkimeli Giriş Butonu -->
        <div class="trade-btn w-full font-black py-4 md:py-5 rounded-xl text-sm md:text-base tracking-[0.1em] uppercase text-center cursor-pointer">
            Sisteme Giriş Yap ve Piyasayı Başlat ➔
        </div>
        
    </div>

    <!-- Gelişmiş Kanvas Motoru -->
    <script>
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');

        let points = [];
        let numPoints = 80;
        let step;
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            step = canvas.width / numPoints;
            
            points = [];
            let currentY = canvas.height / 2;
            for (let i = 0; i <= numPoints; i++) {
                currentY += (Math.random() - 0.48) * 50;
                points.push({ x: i * step, y: currentY });
            }
        }
        
        initCanvas();

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Veri kaydırma mantığı
            points.shift();
            for (let i = 0; i < points.length; i++) {
                points[i].x = i * step;
            }
            
            let lastY = points[points.length - 1].y;
            let nextY = lastY + (Math.random() - 0.49) * 55;
            
            // Sınırlandırma
            if (nextY > canvas.height - 150) nextY = canvas.height - 150;
            if (nextY < 150) nextY = 150;
            points.push({ x: canvas.width, y: nextY });

            // Dolgu (Gradient)
            ctx.beginPath();
            ctx.moveTo(points[0].x, canvas.height);
            for (let i = 0; i < points.length; i++) {
                // Yumuşak geçiş için quadratic curve kullanılabilir ama performans için lineTo kullanıyoruz
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();

            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, 'rgba(0, 255, 204, 0.15)');
            gradient.addColorStop(1, 'rgba(0, 255, 204, 0.0)');
            ctx.fillStyle = gradient;
            ctx.fill();

            // Çizgi
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                if (i === 0) ctx.moveTo(points[i].x, points[i].y);
                else ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Mum grafiği detayları
            for (let i = 0; i < points.length; i += 4) {
                let p = points[i];
                let isGreen = Math.random() > 0.4;
                ctx.strokeStyle = isGreen ? 'rgba(0, 255, 204, 0.5)' : 'rgba(239, 68, 68, 0.5)';
                ctx.fillStyle = isGreen ? 'rgba(0, 255, 204, 0.3)' : 'rgba(239, 68, 68, 0.3)';

                // Fitil
                ctx.beginPath();
                ctx.moveTo(p.x, p.y - 20);
                ctx.lineTo(p.x, p.y + 20);
                ctx.lineWidth = 1;
                ctx.stroke();

                // Gövde
                let candleHeight = Math.random() * 20 + 5;
                ctx.fillRect(p.x - 3, p.y - (candleHeight/2), 6, candleHeight);
            }
        }

        setInterval(drawChart, 60);

        window.addEventListener('resize', initCanvas);

        function girisYap() {
            const container = document.getElementById('main-container');
            container.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = '/disclaimer';
            }, 550);
        }
    </script>
</body>
</html>
