<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küresel Isı Haritası | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; overflow-x: hidden; margin: 0; }
        
        /* Zemin Katmanları */
        .crypto-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%);
            z-index: 0; pointer-events: none;
        }
        .dot-grid {
            position: fixed; inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 1; pointer-events: none;
        }

        .content-layer { position: relative; z-index: 10; }

        /* Neomorphic Üst Bar */
        .glass-panel {
            background: rgba(10, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        /* Zaman Dilimi Butonları */
        .tf-btn { 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .tf-btn:hover { background: rgba(0, 255, 204, 0.1); color: #00ffcc; }
        .tf-btn.active { 
            background: linear-gradient(135deg, #00ffcc 0%, #00b386 100%);
            color: #030407; border-color: #00ffcc; font-weight: 900;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }
        
        /* Isı Haritası Kutu Efektleri (Fon Yöneticisi Stili) */
        .heat-box {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
            cursor: crosshair;
            position: relative;
            overflow: hidden;
        }
        .heat-box::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            pointer-events: none;
        }
        .heat-box:hover {
            transform: scale(1.04);
            z-index: 20;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.3);
            border: 1px solid white;
        }

        /* Hover Bilgi Paneli (Fade) */
        .heat-hover-info {
            opacity: 0; transform: translateY(5px);
            transition: all 0.3s ease;
        }
        .heat-box:hover .heat-hover-info {
            opacity: 1; transform: translateY(0);
        }
        .heat-box:hover > .base-info { opacity: 0; }

        .base-info { transition: opacity 0.3s; }

        /* Yükleme Ekranı (Radar) */
        .loader-ring {
            width: 50px; height: 50px;
            border: 3px solid rgba(0, 255, 204, 0.2);
            border-top-color: #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,204,0.5); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">

    <div class="crypto-bg"></div>
    <div class="dot-grid"></div>

    <div class="content-layer w-full max-w-[1300px] flex flex-col h-[92vh]">
        
        <!-- Üst Başlık ve Glassmorphism Bar -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 pb-5 border-b border-white/10 gap-5 shrink-0">
            <div>
                <a href="/" class="text-gray-400 hover:text-[#00ffcc] transition-colors text-xs font-black flex items-center gap-2 mb-2 uppercase tracking-widest">
                    <span class="text-lg">←</span> ANA PANOYA DÖN
                </a>
                <h1 class="text-2xl md:text-3xl font-black tracking-widest text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">🗺️ LİKİDİTE <span class="text-gray-500">ISI HARİTASI</span></h1>
            </div>
            
            <!-- Zaman Dilimi Butonları -->
            <div class="flex flex-wrap gap-2 glass-panel !rounded-xl !p-2 !shadow-none">
                <button onclick="changeTimeframe('5m')" id="btn-5m" class="tf-btn px-4 py-2 rounded-lg text-[11px] font-black text-gray-400 uppercase tracking-widest">5 DK</button>
                <button onclick="changeTimeframe('15m')" id="btn-15m" class="tf-btn px-4 py-2 rounded-lg text-[11px] font-black text-gray-400 uppercase tracking-widest">15 DK</button>
                <button onclick="changeTimeframe('30m')" id="btn-30m" class="tf-btn px-4 py-2 rounded-lg text-[11px] font-black text-gray-400 uppercase tracking-widest">30 DK</button>
                <button onclick="changeTimeframe('1h')" id="btn-1h" class="tf-btn px-4 py-2 rounded-lg text-[11px] font-black text-gray-400 uppercase tracking-widest">1 SA</button>
                <button onclick="changeTimeframe('4h')" id="btn-4h" class="tf-btn px-4 py-2 rounded-lg text-[11px] font-black text-gray-400 uppercase tracking-widest">4 SA</button>
                <button onclick="changeTimeframe('1d')" id="btn-1d" class="tf-btn active px-4 py-2 rounded-lg text-[11px] font-black text-gray-400 uppercase tracking-widest">1 GÜN</button>
            </div>
        </div>

        <!-- Renk Skalası Anahtarı -->
        <div class="flex items-center justify-end gap-1.5 mb-4 shrink-0 text-[10px] font-black text-gray-500 tracking-widest uppercase">
            <span>Düşüş</span>
            <div class="w-8 h-3 rounded-sm bg-[#991B1B] shadow-[0_0_10px_rgba(153,27,27,0.5)]"></div> 
            <div class="w-8 h-3 rounded-sm bg-[#EF4444] shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div> 
            <div class="w-8 h-3 rounded-sm bg-[#1F2937]"></div> 
            <div class="w-8 h-3 rounded-sm bg-[#10B981] shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div> 
            <div class="w-8 h-3 rounded-sm bg-[#047857] shadow-[0_0_10px_rgba(4,120,87,0.5)]"></div> 
            <span class="ml-1">Yükseliş</span>
        </div>

        <!-- Isı Haritası Alanı (Grid Sistemi) -->
        <div class="flex-grow overflow-y-auto glass-panel !p-2 relative border border-white/10 shadow-[0_0_40px_rgba(0,0,0,0.8)]">
            
            <!-- Yükleme Ekranı -->
            <div id="loading-indicator" class="absolute inset-0 flex flex-col items-center justify-center bg-[#020203]/90 backdrop-blur-sm z-50 hidden rounded-xl transition-all">
                <div class="loader-ring mb-4"></div>
                <span class="text-[#00ffcc] font-black tracking-[0.2em] text-sm drop-shadow-[0_0_10px_rgba(0,255,204,0.5)]">PİYASA MATRİSİ HESAPLANIYOR</span>
            </div>

            <!-- Coin Kutuları Buraya Gelecek -->
            <div id="heatmap-container" class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-8 xl:grid-cols-10 gap-[3px] h-full content-start">
                <!-- Javascript -->
            </div>

        </div>

    </div>

    <!-- ASENKRON ISI HARİTASI MOTORU -->
    <script>
        let currentTimeframe = '1d';
        let refreshInterval;

        async function fetchHeatmapData() {
            try {
                const response = await fetch(`/api/isiharitasi_data?zaman=${currentTimeframe}`);
                const data = await response.json();
                renderHeatmap(data);
                
                // Yükleme ekranını yumuşakça kapat
                setTimeout(() => {
                    document.getElementById('loading-indicator').classList.add('hidden');
                }, 300);
            } catch (error) {
                console.error("Isı Haritası Hatası:", error);
            }
        }

        function getColorCode(change) {
            // Renk paleti profesyonelleştirildi (Gerçek borsa uygulamalarındaki renk uzayı)
            if (change >= 5) return "#065f46"; // Çok Koyu Yeşil
            if (change >= 2 && change < 5) return "#047857"; // Koyu Yeşil
            if (change > 0 && change < 2) return "#10B981"; // Canlı Yeşil
            if (change === 0) return "#374151"; // Nötr Gri
            if (change < 0 && change > -2) return "#EF4444"; // Canlı Kırmızı
            if (change <= -2 && change > -5) return "#B91C1C"; // Koyu Kırmızı
            if (change <= -5) return "#7f1d1d"; // Çok Koyu Kırmızı
            return "#374151";
        }

        function renderHeatmap(data) {
            const container = document.getElementById('heatmap-container');
            let htmlContent = "";
            
            const formatPrice = (price) => price < 1 ? price.toFixed(4) : price.toLocaleString('en-US', {minimumFractionDigits: 2});

            // En büyük hacimli coinler devasa bloklar, orta hacimliler normal, düşük hacimliler küçük bloklar olacak
            data.forEach((coin, index) => {
                const bgColor = getColorCode(coin.degisim);
                const isSign = coin.degisim >= 0 ? "+" : "";
                
                // Hacim büyüklüğüne göre gerçek Treemap (Izgara) görünümü
                let sizeClass, infoSize, titleSize;
                if(index === 0) { // BTC
                    sizeClass = "col-span-3 md:col-span-4 row-span-3 h-48 md:h-64"; titleSize = "text-4xl md:text-5xl"; infoSize = "text-2xl md:text-3xl";
                } else if(index === 1) { // ETH
                    sizeClass = "col-span-3 md:col-span-3 row-span-2 h-32 md:h-48"; titleSize = "text-3xl md:text-4xl"; infoSize = "text-xl md:text-2xl";
                } else if(index > 1 && index < 6) { // Top 5
                    sizeClass = "col-span-2 row-span-2 h-24 md:h-32"; titleSize = "text-xl md:text-2xl"; infoSize = "text-base md:text-lg";
                } else { // Diğerleri
                    sizeClass = "col-span-1 row-span-1 h-16 md:h-20"; titleSize = "text-sm md:text-base"; infoSize = "text-[10px] md:text-xs";
                }

                htmlContent += `
                <div class="heat-box ${sizeClass} rounded flex flex-col items-center justify-center text-white overflow-hidden relative group border border-black/30" 
                     style="background-color: ${bgColor};">
                    
                    <!-- Varsayılan Görünüm -->
                    <div class="base-info flex flex-col items-center justify-center absolute inset-0 z-10 w-full h-full">
                        <span class="${titleSize} font-black tracking-widest drop-shadow-md">${coin.sembol}</span>
                        <span class="${infoSize} opacity-90 font-bold tracking-wide mt-1">${isSign}${coin.degisim.toFixed(2)}%</span>
                    </div>
                    
                    <!-- Hover Olduğunda Çıkan Veri Paneli (Fade Geçişiyle) -->
                    <div class="heat-hover-info absolute inset-0 bg-[#020203]/95 backdrop-blur-sm flex flex-col items-center justify-center z-20 w-full h-full border border-white/20">
                        <span class="text-gray-400 text-[9px] font-black uppercase tracking-[0.2em] mb-1">${coin.sembol} / USDT</span>
                        <span class="text-[#00ffcc] ${index < 6 ? 'text-2xl md:text-3xl' : 'text-base md:text-lg'} font-black drop-shadow-[0_0_10px_rgba(0,255,204,0.3)]">$${formatPrice(coin.fiyat)}</span>
                        <span class="text-gray-300 text-[10px] font-bold tracking-widest mt-2 uppercase">Hacim: <span class="text-white">$${coin.hacim.toFixed(0)}M</span></span>
                    </div>
                </div>`;
            });
            
            container.innerHTML = htmlContent;
        }

        window.changeTimeframe = function(tf) {
            currentTimeframe = tf;
            
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + tf).classList.add('active');

            // Bekleme ekranını göster
            document.getElementById('loading-indicator').classList.remove('hidden');

            fetchHeatmapData();
            clearInterval(refreshInterval);
            refreshInterval = setInterval(fetchHeatmapData, 10000); // 10 saniyede bir otomatik yenile (Limit takılmamak için)
        }

        // Sayfa açıldığında ilk veriyi çek
        fetchHeatmapData();
        refreshInterval = setInterval(fetchHeatmapData, 10000);
    </script>
</body>
</html>
