<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Kuantum Kasa & Risk Merkezi | Qypees Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080c14; color: #e2e8f0; overflow-x: hidden; margin: 0; min-height: 100vh; }
        
        .app-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 0%, #132238 0%, #080c14 70%);
            z-index: 0; pointer-events: none;
        }

        .content-layer { position: relative; z-index: 10; display: flex; flex-direction: column; min-height: 100vh; }

        .ui-panel {
            background: rgba(14, 22, 35, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .accent-btn {
            background: linear-gradient(135deg, #00d2ff 0%, #0099ff 100%);
            color: #080c14;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
        }
        .accent-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
        }

        .pro-input {
            background: rgba(8, 12, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #00d2ff;
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s;
        }
        .pro-input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .list-item {
            background: rgba(14, 22, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .list-item:hover {
            background: rgba(0, 210, 255, 0.04);
            border-color: rgba(0, 210, 255, 0.3);
            transform: translateX(3px);
        }

        .msg-bubble {
            background: linear-gradient(135deg, #00d2ff 0%, #0099ff 100%);
            color: #080c14;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .msg-bubble:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.7);
        }

        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { padding: 12px 20px; border-radius: 10px; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: white; animation: slideIn 0.3s ease forwards; backdrop-filter: blur(10px); }
        .toast-success { background: rgba(0, 210, 255, 0.15); border: 1px solid #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); color: #00d2ff; }
        .toast-error { background: rgba(244, 63, 94, 0.15); border: 1px solid #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.3); color: #f43f5e; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 210, 255, 0.5); }
    </style>
</head>
<body class="p-4 md:p-6 flex flex-col items-center">

    <div class="app-bg"></div>
    <div id="toast-container"></div>

    <div class="content-layer w-full max-w-[1500px] flex flex-col min-h-[90vh]">
        <div id="app-view" class="flex-grow flex flex-col overflow-hidden fade-in"></div>
    </div>

    <script>
        let aktifSayfa = 'menu';
        let seciliPozisyon = null;
        let spotVarliklar = [];
        let vadeliPozisyonlar = [];
        let notlarListesi = [
            { id: 1, baslik: "BTC Breakout Denemesi", psikoloji: "Sakin / Odaklı", icerik: "Destek bölgesinden kusursuz sekti, kurala uyarak kar aldım.", zaman: "Bugün, 14:20" },
            { id: 2, baslik: "ETH Likidite Avı", psikoloji: "Hırslı / Tilt", icerik: "Stop loss seviyesini aşağı kaydırdım, kural dışı işlem oldu. Dikkat edilmeli.", zaman: "Dün, 22:10" }
        ];
        let canliFiyatTimer = null;

        function toggleInfoModal() {
            const modal = document.getElementById('info-modal');
            if(modal.classList.contains('hidden')) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        async function veriGetir() {
            try {
                const sRes = await fetch('/api/cuzdan/spot'); spotVarliklar = await sRes.json();
                const vRes = await fetch('/api/cuzdan/vadeli'); vadeliPozisyonlar = await vRes.json();
            } catch(e) {}
        }

        async function render() {
            if (aktifSayfa !== 'detay' && canliFiyatTimer) { clearInterval(canliFiyatTimer); canliFiyatTimer = null; }
            await veriGetir();
            const view = document.getElementById('app-view');
            
            view.classList.remove('fade-in'); void view.offsetWidth; view.classList.add('fade-in');

            let toplamSpot = spotVarliklar.reduce((acc, v) => acc + parseFloat(v.bakiye || 0), 0);
            let toplamVadeliMarjin = vadeliPozisyonlar.reduce((acc, p) => acc + parseFloat(p.miktar || 0), 0);
            let anaKasa = (toplamSpot + toplamVadeliMarjin) || 0.001; 
            
            let vadeliRiskOrani = (toplamVadeliMarjin / anaKasa) * 100;
            let var95 = anaKasa * (vadeliRiskOrani / 100) * 0.15; 
            
            let riskSkoru = 100 - (vadeliRiskOrani * 1.8);
            if (riskSkoru < 0) riskSkoru = 0; if (riskSkoru > 100) riskSkoru = 100;
            
            let riskRenk = riskSkoru > 75 ? '#00d2ff' : (riskSkoru > 45 ? '#f59e0b' : '#f43f5e');
            let riskDurumu = riskSkoru > 75 ? 'OPTİMAL RİSK İZOLASYONU' : (riskSkoru > 45 ? 'DİKKAT: HEDGE GEREKLİ' : 'KRİTİK: TASFİYE TEHLİKESİ');
            
            if (aktifSayfa === 'menu') {
                view.innerHTML = `
                    <div class="ui-panel p-4 flex items-center justify-between mb-4 shrink-0 relative">
                        <div class="flex items-center gap-4">
                            <a href="/pano" class="text-slate-400 hover:text-[#00d2ff] transition-colors text-xs font-bold flex items-center gap-2 uppercase tracking-wider">
                                <span>←</span> KOMUTA MERKEZİ
                            </a>
                            <div class="h-5 w-px bg-white/10"></div>
                            <h1 class="text-lg md:text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                                💼 KASA, RİSK & POST-TRADE <span class="text-[#00d2ff] text-xs font-semibold px-2.5 py-0.5 rounded-full bg-[#00d2ff]/10 border border-[#00d2ff]/20">MİMARİ MERKEZİ</span>
                            </h1>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="toggleInfoModal()" class="msg-bubble w-9 h-9 rounded-full flex items-center justify-center relative shrink-0 shadow-lg" title="Sistem Özellikleri Rehberi">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- REHBER MODALI -->
                    <div id="info-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                        <div class="ui-panel max-w-xl w-full p-6 flex flex-col gap-4 border-[#00d2ff]/40 shadow-2xl">
                            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                                <div class="flex items-center gap-2">
                                    <span class="text-xl">💬</span>
                                    <h3 class="text-[#00d2ff] font-extrabold text-sm uppercase tracking-wider">Kasa & Risk Merkezi - Rehber</h3>
                                </div>
                                <button onclick="toggleInfoModal()" class="text-slate-400 hover:text-white font-bold text-sm">✕ Kapat</button>
                            </div>
                            <div class="flex flex-col gap-3 text-xs text-slate-300 leading-relaxed max-h-[60vh] overflow-y-auto pr-2">
                                <div class="bg-[#080c14] p-3 rounded-xl border border-white/5">
                                    <strong class="text-white block mb-1">💼 Spot & Soğuk Depo</strong>
                                    Varlık rezervlerinizi ve spot bakiyelerinizi yönetin.
                                </div>
                                <div class="bg-[#080c14] p-3 rounded-xl border border-white/5">
                                    <strong class="text-white block mb-1">⚔️ Vadeli HFT Radarı</strong>
                                    Kaldıraçlı pozisyonlarınızı ve VaR risk modelini takip edin.
                                </div>
                                <div class="bg-[#080c14] p-3 rounded-xl border border-white/5">
                                    <strong class="text-white block mb-1">📝 Post-Trade & Tilt Metre</strong>
                                    İşlem psikolojinizi ve psikometrik loglarınızı kaydedin.
                                </div>
                            </div>
                            <button onclick="toggleInfoModal()" class="accent-btn w-full py-2.5 rounded-xl text-xs uppercase tracking-wider font-extrabold">Anladım, Kapat</button>
                        </div>
                    </div>
                    
                    <div class="overflow-y-auto flex-grow pb-10 flex flex-col gap-4 pr-1">
                        <!-- Üst Kısım: Kurumsal VaR ve Kasa Özeti -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                            <div class="ui-panel p-5 flex flex-col justify-center border-[#00d2ff]/30 bg-[#00d2ff]/5">
                                <span class="text-[#00d2ff] font-extrabold text-[10px] tracking-wider uppercase mb-1">Total AUM (Yönetilen Varlık)</span>
                                <h2 class="text-3xl font-extrabold text-white mb-2">$${anaKasa.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</h2>
                                <p class="text-slate-400 text-xs font-semibold flex items-center justify-between">
                                    <span>24H Değişim:</span>
                                    <span class="text-[#00d2ff] bg-[#00d2ff]/10 px-2.5 py-0.5 rounded-lg border border-[#00d2ff]/20">+1.24%</span>
                                </p>
                            </div>
                            
                            <div class="ui-panel p-5 lg:col-span-2 flex flex-col justify-center relative overflow-hidden">
                                <div class="flex justify-between items-start mb-3">
                                    <div>
                                        <span class="text-slate-400 font-extrabold text-[10px] tracking-wider uppercase block mb-1">Q-AI Value-at-Risk (VaR) Modeli</span>
                                        <h3 class="text-white text-base font-extrabold">Sistem Sağlığı: <span style="color: ${riskRenk};">${riskSkoru.toFixed(0)}/100</span></h3>
                                    </div>
                                    <span class="text-[10px] font-extrabold uppercase px-3 py-1 rounded-lg border" style="color: ${riskRenk}; border-color: ${riskRenk}40; background: ${riskRenk}15;">
                                        ${riskDurumu}
                                    </span>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div class="bg-[#060911] p-3 rounded-xl border border-white/5">
                                        <span class="block text-slate-400 text-[10px] font-semibold uppercase mb-1">Spot İzolasyon</span>
                                        <span class="text-white font-extrabold text-xs">$${toplamSpot.toLocaleString('en-US')} (%${(100 - vadeliRiskOrani).toFixed(1)})</span>
                                    </div>
                                    <div class="bg-[#060911] p-3 rounded-xl border border-white/5">
                                        <span class="block text-slate-400 text-[10px] font-semibold uppercase mb-1">Marjin Yükü</span>
                                        <span class="text-rose-400 font-extrabold text-xs">$${toplamVadeliMarjin.toLocaleString('en-US')} (%${vadeliRiskOrani.toFixed(1)})</span>
                                    </div>
                                    <div class="bg-[#060911] p-3 rounded-xl border border-white/5">
                                        <span class="block text-slate-400 text-[10px] font-semibold uppercase mb-1">Öngörülen MDD</span>
                                        <span class="text-amber-400 font-extrabold text-xs">-$${var95.toLocaleString('en-US', {maximumFractionDigits:2})}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Cüzdan ve Post-Trade Modülleri -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div onclick="aktifSayfa='spot'; render();" class="ui-panel p-5 cursor-pointer flex items-center gap-4 hover:border-[#00d2ff]/50 transition-all">
                                <div class="w-12 h-12 rounded-2xl bg-[#00d2ff]/10 border border-[#00d2ff]/30 flex items-center justify-center text-2xl shadow-inner">💼</div>
                                <div class="flex flex-col text-left">
                                    <h2 class="text-sm font-extrabold text-white tracking-wide mb-0.5">SPOT & SOĞUK DEPO</h2>
                                    <p class="text-slate-400 text-[11px]">Rezervler.</p>
                                </div>
                            </div>
                            
                            <div onclick="aktifSayfa='vadeli'; render();" class="ui-panel p-5 cursor-pointer flex items-center gap-4 hover:border-rose-500/50 transition-all">
                                <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-2xl shadow-inner">⚔️</div>
                                <div class="flex flex-col text-left">
                                    <h2 class="text-sm font-extrabold text-white tracking-wide mb-0.5">VADELİ HFT RADARI</h2>
                                    <p class="text-slate-400 text-[11px]">Kaldıraçlar.</p>
                                </div>
                            </div>

                            <div onclick="aktifSayfa='notdefteri'; render();" class="ui-panel p-5 cursor-pointer flex items-center gap-4 hover:border-purple-500/50 transition-all">
                                <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-2xl shadow-inner">📝</div>
                                <div class="flex flex-col text-left">
                                    <h2 class="text-sm font-extrabold text-white tracking-wide mb-0.5">POST-TRADE & TİLT</h2>
                                    <p class="text-slate-400 text-[11px]">Psikometrik Log.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } 
            else if (aktifSayfa === 'spot') {
                let listHTML = spotVarliklar.length === 0 ? 
                    `<div class="flex flex-col items-center justify-center h-48 gap-3 opacity-60"><span class="text-4xl">📭</span><p class="text-xs text-slate-400 font-bold uppercase">Cüzdan Rezervi Bulunamadı</p></div>` : '';
                
                spotVarliklar.forEach((v, i) => {
                    listHTML += `
                        <div class="list-item p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-[#00d2ff]/10 border border-[#00d2ff]/30 flex items-center justify-center text-lg shadow-inner">🏦</div>
                                <div>
                                    <h3 class="font-extrabold text-sm text-white tracking-wide">${v.borsa}</h3>
                                    <p class="text-slate-400 text-xs mt-0.5 font-medium">${v.detay}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end border-t md:border-none border-white/5 pt-3 md:pt-0">
                                <span class="font-extrabold text-base text-[#00d2ff]">$${v.bakiye}</span>
                                <button onclick="spotSil(${i})" class="text-rose-400 hover:text-white bg-rose-500/10 hover:bg-rose-500 border border-rose-500/30 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all">SİL</button>
                            </div>
                        </div>
                    `;
                });

                view.innerHTML = `
                    <div class="ui-panel p-4 flex items-center justify-between mb-4 shrink-0">
                        <button onclick="aktifSayfa='menu'; render();" class="text-slate-400 hover:text-[#00d2ff] text-xs font-bold flex items-center gap-2 uppercase tracking-wider transition-colors"><span>←</span> Geri Dön</button>
                        <h1 class="text-base font-extrabold text-white uppercase tracking-wider">SOĞUK & SPOT REZERVLER</h1>
                        <button onclick="toggleForm()" class="accent-btn px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition-all">➕ YENİ EKLE</button>
                    </div>

                    <div id="spot-form" class="hidden ui-panel p-5 mb-4 flex flex-col gap-3 border-[#00d2ff]/40 shadow-2xl">
                        <h3 class="text-[#00d2ff] font-extrabold text-xs uppercase tracking-wider">Zincir / Borsa Kaydı Ekle</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <select id="f-borsa" class="pro-input">
                                <option value="Binance">Binance Spot</option><option value="OKX">OKX Funding</option><option value="Cold Wallet">Soğuk Cüzdan (Ledger)</option><option value="DeFi">DeFi (Aave/Curve)</option>
                            </select>
                            <input type="text" id="f-bakiye" placeholder="Toplam USD Değeri" class="pro-input">
                            <input type="text" id="f-detay" placeholder="Detay (Örn: 50 ETH İzolasyonu)" class="pro-input">
                        </div>
                        <div class="flex gap-2 justify-end mt-1">
                            <button onclick="toggleForm()" class="text-slate-400 hover:text-white px-4 py-2 text-xs font-bold transition-colors">İPTAL</button>
                            <button onclick="spotEkle()" class="accent-btn px-6 py-2 rounded-xl text-xs uppercase tracking-wider font-extrabold">KAYDET</button>
                        </div>
                    </div>

                    <div class="overflow-y-auto flex-grow flex flex-col gap-3 pr-1">${listHTML}</div>
                `;
            }
            else if (aktifSayfa === 'vadeli') {
                let pozListHTML = vadeliPozisyonlar.length === 0 ? 
                    `<div class="flex flex-col items-center justify-center h-48 gap-3 opacity-60"><span class="text-4xl">📡</span><p class="text-xs text-slate-400 font-bold uppercase">Aktif Vadeli Pozisyon Yok</p></div>` : '';
                
                vadeliPozisyonlar.forEach((p, i) => {
                    const renk = p.yon === 'LONG' ? '#00d2ff' : '#f43f5e';
                    
                    pozListHTML += `
                        <div onclick="seciliPozisyon=${i}; aktifSayfa='detay'; render();" class="list-item p-4 flex items-center justify-between cursor-pointer relative overflow-hidden group border-l-4" style="border-left-color: ${renk};">
                            <div class="flex flex-col">
                                <h3 class="font-extrabold text-sm text-white tracking-wide">${p.coin} <span class="text-slate-500 text-[10px]">/USDT</span></h3>
                                <p class="font-bold text-[10px] mt-0.5 tracking-wider" style="color: ${renk};">${p.kaldirac} | ${p.yon}</p>
                            </div>
                            <div class="flex items-center gap-6 text-right">
                                <div class="hidden md:block">
                                    <span class="text-slate-500 text-[9px] block uppercase font-semibold">Marjin</span>
                                    <span class="font-extrabold text-sm text-white">$${p.miktar}</span>
                                </div>
                                <span class="text-slate-500 text-lg group-hover:text-white group-hover:translate-x-1 transition-all">➔</span>
                            </div>
                        </div>
                    `;
                });

                view.innerHTML = `
                    <div class="ui-panel p-4 flex items-center justify-between mb-4 shrink-0">
                        <button onclick="aktifSayfa='menu'; render();" class="text-slate-400 hover:text-[#00d2ff] text-xs font-bold flex items-center gap-2 uppercase tracking-wider transition-colors"><span>←</span> Geri Dön</button>
                        <h1 class="text-base font-extrabold text-rose-400 uppercase tracking-wider">VADELİ HFT RADARI</h1>
                    </div>

                    <div class="ui-panel p-5 mb-4 flex flex-col gap-3 border-rose-500/30">
                        <h3 class="text-rose-400 font-extrabold text-xs uppercase tracking-wider">Manuel / API Emir Girişi</h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <input type="text" id="v-coin" placeholder="Sembol (BTC)" class="pro-input uppercase font-extrabold text-white">
                            <select id="v-kaldirac" class="pro-input font-extrabold">
                                <option value="10x">10x Risk</option><option value="25x">25x Risk</option><option value="50x">50x Risk</option><option value="100x">100x HFT</option>
                            </select>
                            <select id="v-yon" class="pro-input font-extrabold">
                                <option value="LONG">LONG (Yükseliş)</option><option value="SHORT">SHORT (Düşüş)</option>
                            </select>
                            <input type="number" id="v-miktar" placeholder="Marjin ($)" class="pro-input font-extrabold">
                        </div>
                        <button onclick="vadeliEkle()" class="w-full bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-400 font-extrabold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">RADARA EKLE & BAŞLAT</button>
                    </div>

                    <div class="overflow-y-auto flex-grow flex flex-col gap-3 pr-1">${pozListHTML}</div>
                `;
            }
            else if (aktifSayfa === 'notdefteri') {
                let notlarHTML = '';
                notlarListesi.forEach((n, idx) => {
                    notlarHTML += `
                        <div class="list-item p-4 flex flex-col gap-2">
                            <div class="flex justify-between items-center">
                                <span class="font-extrabold text-xs text-white">${n.baslik}</span>
                                <span class="text-[10px] text-purple-400 bg-purple-500/10 border border-purple-500/20 px-2 py-0.5 rounded">${n.psikoloji}</span>
                            </div>
                            <p class="text-xs text-slate-300">${n.icerik}</p>
                            <div class="flex justify-between items-center text-[9px] text-slate-500 mt-1">
                                <span>${n.zaman}</span>
                                <button onclick="notSil(${idx})" class="text-rose-400 hover:text-white">Sil</button>
                            </div>
                        </div>
                    `;
                });

                view.innerHTML = `
                    <div class="ui-panel p-4 flex items-center justify-between mb-4 shrink-0">
                        <button onclick="aktifSayfa='menu'; render();" class="text-slate-400 hover:text-[#00d2ff] text-xs font-bold flex items-center gap-2 uppercase tracking-wider transition-colors"><span>←</span> Geri Dön</button>
                        <h1 class="text-base font-extrabold text-purple-400 uppercase tracking-wider">📝 POST-TRADE & TİLT METRE</h1>
                    </div>

                    <div class="ui-panel p-5 mb-4 flex flex-col gap-3 border-purple-500/30">
                        <h3 class="text-purple-400 font-extrabold text-xs uppercase tracking-wider">Yeni Psikometrik Log Ekle</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <input type="text" id="not-baslik" placeholder="İşlem Başlığı (Örn: BTC Breakout)" class="pro-input">
                            <select id="not-psi" class="pro-input font-extrabold">
                                <option value="Sakin / Odaklı">Sakin / Odaklı</option>
                                <option value="Hırslı / Tilt">Hırslı / Tilt</option>
                                <option value="Korku / Panik">Korku / Panik</option>
                                <option value="Disiplinli">Disiplinli</option>
                            </select>
                        </div>
                        <textarea id="not-icerik" placeholder="İşlem psikolojisi, hatalar ve çıkarılan dersler..." class="pro-input h-20 resize-none"></textarea>
                        <button onclick="notEkle()" class="w-full bg-purple-500/20 hover:bg-purple-500/30 border border-purple-500/40 text-purple-400 font-extrabold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">NOTU KAYDET</button>
                    </div>

                    <div class="overflow-y-auto flex-grow flex flex-col gap-3 pr-1">${notlarHTML}</div>
                `;
            }
            else if (aktifSayfa === 'detay') {
                const poz = vadeliPozisyonlar[seciliPozisyon];
                const renk = poz.yon === 'LONG' ? '#00d2ff' : '#f43f5e';

                view.innerHTML = `
                    <div class="ui-panel p-4 flex items-center justify-between mb-4 shrink-0">
                        <button onclick="aktifSayfa='vadeli'; render();" class="text-slate-400 hover:text-[#00d2ff] text-xs font-bold flex items-center gap-2 uppercase tracking-wider transition-colors"><span>←</span> Radara Dön</button>
                        <h1 class="text-base font-extrabold uppercase tracking-wider" style="color: ${renk};">⚡ ${poz.coin} HFT PANEL</h1>
                    </div>

                    <div class="overflow-y-auto flex-grow pr-1 flex flex-col gap-4">
                        <div class="ui-panel grid grid-cols-2 md:grid-cols-4 gap-3 p-4 text-center border-l-4" style="border-left-color: ${renk};">
                            <div><span class="text-slate-400 text-[10px] font-bold uppercase block mb-0.5">Vektör</span><span class="text-sm font-extrabold" style="color: ${renk};">${poz.yon}</span></div>
                            <div><span class="text-slate-400 text-[10px] font-bold uppercase block mb-0.5">Çarpan</span><span class="text-sm font-extrabold text-white">${poz.kaldirac}</span></div>
                            <div><span class="text-slate-400 text-[10px] font-bold uppercase block mb-0.5">İzolasyon</span><span class="text-sm font-extrabold text-white">$${poz.miktar}</span></div>
                            <div><span class="text-slate-400 text-[10px] font-bold uppercase block mb-0.5">Execute Log</span><span class="text-xs font-bold text-slate-300">${poz.zaman}</span></div>
                        </div>

                        <div class="ui-panel grid grid-cols-1 md:grid-cols-3 gap-4 p-6 text-center items-center bg-[#060911]">
                            <div>
                                <span class="text-slate-400 text-[10px] font-bold uppercase block mb-1">L2 Tahta Fiyatı (Binance)</span>
                                <span id="canli-fiyat" class="text-2xl font-extrabold text-white">---</span>
                            </div>
                            <div class="border-y md:border-y-0 md:border-x border-white/10 py-3 md:py-0">
                                <span class="text-slate-400 text-[10px] font-bold uppercase block mb-1">Net PnL</span>
                                <span id="canli-pnl" class="text-3xl font-extrabold text-slate-500">$0.00</span>
                            </div>
                            <div>
                                <span class="text-slate-400 text-[10px] font-bold uppercase block mb-1">ROE (Getiri)</span>
                                <span id="canli-yuzde" class="text-2xl font-extrabold text-slate-500">%0.00</span>
                            </div>
                        </div>

                        <div class="ui-panel p-5 border-[#00d2ff]/20 flex flex-col gap-3">
                            <h3 class="text-white font-extrabold text-xs uppercase tracking-wider border-b border-white/5 pb-2">Dinamik Risk Kalkanı</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div class="bg-[#060911] border border-rose-500/20 p-3 rounded-xl flex items-center justify-between">
                                    <span class="text-rose-400 text-xs font-bold">Sert Stop-Loss</span>
                                    <span id="ai-sl" class="text-white font-extrabold text-xs">Hesaplanıyor...</span>
                                </div>
                                <div class="bg-[#060911] border border-[#00d2ff]/20 p-3 rounded-xl flex items-center justify-between">
                                    <span class="text-[#00d2ff] text-xs font-bold">Take-Profit Hedefi</span>
                                    <span id="ai-tp" class="text-white font-extrabold text-xs">Hesaplanıyor...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3 pt-3 border-t border-white/10 shrink-0 flex items-center justify-between">
                        <span class="text-emerald-400 text-xs font-bold flex items-center gap-2">● Risk İzolasyonu Devrede</span>
                        <button onclick="vadeliSil(${seciliPozisyon})" class="bg-rose-500/10 hover:bg-rose-500 border border-rose-500/30 text-rose-400 hover:text-white font-extrabold px-5 py-2 rounded-xl text-xs uppercase tracking-wider transition-all">POZİSYONU KAPAT</button>
                    </div>
                `;

                baslatCanliTakip(poz);
            }
        }

        async function baslatCanliTakip(poz) {
            const coinSembol = poz.coin.toUpperCase() + 'USDT';
            
            async function guncelle() {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${coinSembol}`);
                    const data = await res.json();
                    if(!data.price) return;
                    
                    const guncelFiyat = parseFloat(data.price);
                    const girisFiyati = guncelFiyat * (poz.yon === 'LONG' ? 0.998 : 1.002);
                    const kaldiracSayi = parseInt(poz.kaldirac.replace('x', ''));
                    const marjin = parseFloat(poz.miktar);

                    let fiyatFarkiOrani = poz.yon === 'LONG' ? (guncelFiyat - girisFiyati) / girisFiyati : (girisFiyati - guncelFiyat) / girisFiyati;
                    let pnlDolar = marjin * kaldiracSayi * fiyatFarkiOrani;
                    let pnlYuzde = fiyatFarkiOrani * kaldiracSayi * 100;

                    const fiyatEl = document.getElementById('canli-fiyat');
                    const pnlEl = document.getElementById('canli-pnl');
                    const yuzdeEl = document.getElementById('canli-yuzde');
                    const slEl = document.getElementById('ai-sl');
                    const tpEl = document.getElementById('ai-tp');

                    if(fiyatEl) fiyatEl.innerText = `$${guncelFiyat >= 1 ? guncelFiyat.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) : guncelFiyat.toFixed(6)}`;
                    
                    if(pnlEl && yuzdeEl) {
                        const isProfit = pnlDolar >= 0;
                        const renkHex = isProfit ? '#00d2ff' : '#f43f5e';
                        
                        pnlEl.style.color = renkHex;
                        yuzdeEl.style.color = renkHex;
                        pnlEl.innerText = `${isProfit ? '+' : ''}$${pnlDolar.toFixed(2)}`;
                        yuzdeEl.innerText = `${isProfit ? '+' : ''}${pnlYuzde.toFixed(2)}%`;
                    }

                    if(slEl && tpEl) {
                        let slFiyat, tpFiyat;
                        if(poz.yon === 'LONG') {
                            slFiyat = guncelFiyat * (1 - (0.04 / kaldiracSayi)); 
                            tpFiyat = guncelFiyat * (1 + (0.08 / kaldiracSayi));
                        } else {
                            slFiyat = guncelFiyat * (1 + (0.04 / kaldiracSayi));
                            tpFiyat = guncelFiyat * (1 - (0.08 / kaldiracSayi));
                        }
                        slEl.innerText = `$${slFiyat >= 1 ? slFiyat.toFixed(2) : slFiyat.toFixed(6)}`;
                        tpFiyat.innerText = `$${tpFiyat >= 1 ? tpFiyat.toFixed(2) : tpFiyat.toFixed(6)}`;
                    }
                } catch(e) {}
            }

            guncelle();
            canliFiyatTimer = setInterval(guncelle, 1000);
        }

        function toggleForm() {
            const f = document.getElementById('spot-form');
            if(f.classList.contains('hidden')) f.classList.remove('hidden');
            else f.classList.add('hidden');
        }

        async function spotEkle() {
            const borsa = document.getElementById('f-borsa').value;
            const bakiye = document.getElementById('f-bakiye').value;
            const detay = document.getElementById('f-detay').value;
            if(!bakiye) return showToast('Miktar girilmedi!', 'error');

            await fetch('/api/cuzdan/spot', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({borsa, bakiye, detay})
            });
            showToast('Rezerv Kaydedildi', 'success');
            render();
        }

        async function spotSil(index) {
            await fetch(`/api/cuzdan/spot/${index}`, {method: 'DELETE'});
            showToast('Kayıt Silindi', 'error');
            render();
        }

        async function vadeliEkle() {
            const coin = document.getElementById('v-coin').value;
            const kaldirac = document.getElementById('v-kaldirac').value;
            const yon = document.getElementById('v-yon').value;
            const miktar = document.getElementById('v-miktar').value;
            if(!coin || !miktar) return showToast('Eksik bilgi!', 'error');

            await fetch('/api/cuzdan/vadeli', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({coin, kaldirac, yon, miktar})
            });
            showToast('Emir Radar Pinglemesi Başarılı', 'success');
            render();
        }

        async function vadeliSil(index) {
            if(canliFiyatTimer) clearInterval(canliFiyatTimer);
            await fetch(`/api/cuzdan/vadeli/${index}`, {method: 'DELETE'});
            showToast('Pozisyon Kapatıldı', 'error');
            aktifSayfa = 'vadeli';
            render();
        }

        function notEkle() {
            const baslik = document.getElementById('not-baslik').value;
            const psikoloji = document.getElementById('not-psi').value;
            const icerik = document.getElementById('not-icerik').value;
            if(!baslik || !icerik) return showToast('Eksik alan var!', 'error');

            notlarListesi.unshift({ id: Date.now(), baslik, psikoloji, icerik, zaman: 'Şimdi' });
            showToast('Not Kaydedildi', 'success');
            render();
        }

        function notSil(index) {
            notlarListesi.splice(index, 1);
            showToast('Not Silindi', 'error');
            render();
        }

        render();
    </script>
</body>
</html>
