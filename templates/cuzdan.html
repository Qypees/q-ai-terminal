<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Kuantum Kasa & Risk Merkezi | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Inter:wght@300;400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; overflow-x: hidden; margin: 0; }
        
        /* Zemin Katmanları */
        .crypto-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.9) 0%, rgba(2, 2, 3, 0.99) 80%); z-index: 0; pointer-events: none; }
        .grid-bg { position: fixed; inset: 0; background-image: linear-gradient(rgba(0,255,204,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,204,0.03) 1px, transparent 1px); background-size: 20px 20px; z-index: 1; pointer-events: none; }

        .content-layer { position: relative; z-index: 10; }
        .cyber-text { font-family: 'JetBrains Mono', monospace; }

        /* Neomorphic Glass Panel */
        .glass-panel {
            background: rgba(5, 8, 14, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 204, 0.15); border-top: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 16px; box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.02);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-btn:hover { transform: translateY(-2px); background: rgba(15, 22, 35, 0.9); border-color: var(--hover-color, rgba(0,255,204,0.4)); box-shadow: 0 15px 30px -10px var(--hover-shadow, rgba(0,255,204,0.2)); }

        /* Modern Form Inputları */
        .pro-input { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 204, 0.2); color: #00ffcc; font-family: 'JetBrains Mono', monospace; border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.875rem; transition: all 0.3s ease; outline: none; }
        .pro-input:focus { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); background: rgba(5, 8, 14, 0.9); }

        /* Liste Öğeleri */
        .list-item { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 255, 204, 0.1); border-radius: 12px; transition: all 0.2s ease; }
        .list-item:hover { background: rgba(5, 8, 14, 0.8); border-color: rgba(0, 255, 204, 0.3); }

        /* Checkbox Grid (100 Features) */
        .check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem; }
        @media (min-width: 768px) { .check-grid { grid-template-columns: repeat(4, 1fr); } }
        .feature-checkbox { display: flex; align-items: center; gap: 0.4rem; font-size: 0.55rem; color: #94A3B8; font-family: 'JetBrains Mono', monospace; cursor: pointer; text-transform: uppercase;}
        .feature-checkbox input { accent-color: #00ffcc; width: 10px; height: 10px; cursor: pointer; }
        .feature-checkbox:hover { color: #00ffcc; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,204,0.3); border-radius: 10px; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Toast */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { padding: 12px 20px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-weight: bold; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: white; animation: slideIn 0.3s ease forwards; backdrop-filter: blur(10px); }
        .toast-success { background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        .toast-error { background: rgba(239, 68, 68, 0.1); border: 1px solid #EF4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">

    <div class="crypto-bg"></div>

    <div id="toast-container"></div>

    <div class="content-layer w-full max-w-[1400px] flex flex-col h-[94vh]">
        
        <!-- Dinamik Görünüm Alanı -->

            <!-- JavaScript burayı dolduracak -->
        </div>

    </div>

    <!-- CÜZDAN & RİSK JS MOTORU -->
    <script>
        let aktifSayfa = 'menu'; // 'menu', 'spot', 'vadeli', 'detay'
        let seciliPozisyon = null;
        let spotVarliklar = [];
        let vadeliPozisyonlar = [];
        let canliFiyatTimer = null;

        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        async function veriGetir() {
            try {
                const sRes = await fetch('/api/cuzdan/spot'); spotVarliklar = await sRes.json();
                const vRes = await fetch('/api/cuzdan/vadeli'); vadeliPozisyonlar = await vRes.json();
            } catch(e) {}
        }

        async function render() {
            if (aktifSayfa !== 'detay' && canliFiyatTimer) { clearInterval(canliFiyatTimer); canliFiyatTimer = null; }
            await veriGetir();
            const view = document.getElementById('app-view');
            
            view.classList.remove('fade-in'); void view.offsetWidth; view.classList.add('fade-in');

            // --- PORTFÖY HFT RİSK HESAPLAMALARI ---
            let toplamSpot = spotVarliklar.reduce((acc, v) => acc + parseFloat(v.bakiye || 0), 0);
            let toplamVadeliMarjin = vadeliPozisyonlar.reduce((acc, p) => acc + parseFloat(p.miktar || 0), 0);
            let anaKasa = (toplamSpot + toplamVadeliMarjin) || 0.001; 
            
            let vadeliRiskOrani = (toplamVadeliMarjin / anaKasa) * 100;
            // VaR (Riske Maruz Değer) Simülasyonu
            let var95 = anaKasa * (vadeliRiskOrani / 100) * 0.15; 
            
            let riskSkoru = 100 - (vadeliRiskOrani * 1.8);
            if (riskSkoru < 0) riskSkoru = 0; if (riskSkoru > 100) riskSkoru = 100;
            
            let riskRenk = riskSkoru > 75 ? '#00ffcc' : (riskSkoru > 45 ? '#F59E0B' : '#EF4444');

                        <span class="text-[#00ffcc] text-[10px] font-bold cyber-text border border-[#00ffcc]/30 px-2 py-1 rounded bg-[#00ffcc]/10">HFT RISK ENGINE V4</span>

                                <h2 class="text-3xl font-black text-white drop-shadow-md mb-2 cyber-text">$${anaKasa.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</h2>
                                <p class="text-gray-400 text-[10px] font-bold flex items-center justify-between cyber-text">

                                    <span class="text-[#00ffcc] bg-[#00ffcc]/10 px-2 py-0.5 rounded border border-[#00ffcc]/20">+1.24%</span>
                                </p>

                                    </div>

                                        ${riskDurumu}
                                    </span>

                                        <span class="text-red-400 font-black text-xs cyber-text">$${toplamVadeliMarjin.toLocaleString('en-US')} (%${vadeliRiskOrani.toFixed(1)})</span>
                                    </div>

                                </div>

                            <div onclick="aktifSayfa='vadeli'; render();" style="--hover-color: rgba(239, 68, 68, 0.5); --hover-shadow: rgba(239, 68, 68, 0.15);" class="glass-panel glass-btn p-5 cursor-pointer flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(239,68,68,0.15)]">⚔️</div>
                                <div class="text-left">
                                    <h2 class="text-sm font-black text-red-400 tracking-wide mb-1 cyber-text">VADELİ HFT RADARI</h2>
                                    <p class="text-gray-400 text-[9px] font-medium cyber-text">Aktif kaldıraçlar ve tasfiye izleme.</p>
                                </div>
                            </div>
                        </div>

                        <!-- 100 HFT & RİSK ÖZELLİĞİ PANELI -->
                        <div class="glass-panel p-5 border-[#00ffcc]/20">
                            <div class="flex items-center justify-between mb-3 border-b border-[#00ffcc]/10 pb-2">
                                <h3 class="text-[#00ffcc] font-black text-[10px] tracking-widest uppercase cyber-text">HFT Risk Kalkanları & Parametreler (100)</h3>
                                <span class="w-2 h-2 bg-[#00ffcc] rounded-full animate-ping"></span>
                            </div>
                            
                            <div class="flex flex-col gap-2">
                                <!-- Kategori 1: Portföy Risk & İzolasyon (25) -->
                                <div class="bg-[#05070A] border border-white/5 rounded p-2">
                                    <h4 class="text-white text-[8px] font-bold mb-1.5 uppercase tracking-wider border-b border-white/10 pb-1 text-blue-300 cyber-text">1. Portföy Riski & İzolasyon (25)</h4>
                                    <div class="check-grid">

        async function baslatCanliTakip(poz) {
            const coinSembol = poz.coin.toUpperCase() + 'USDT';
            
            async function guncelle() {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${coinSembol}`);
                    const data = await res.json();
                    if(!data.price) return;
                    
                    const guncelFiyat = parseFloat(data.price);
                    const girisFiyati = guncelFiyat * (poz.yon === 'LONG' ? 0.998 : 1.002);
                    const kaldiracSayi = parseInt(poz.kaldirac.replace('x', ''));
                    const marjin = parseFloat(poz.miktar);

                    let fiyatFarkiOrani = poz.yon === 'LONG' ? (guncelFiyat - girisFiyati) / girisFiyati : (girisFiyati - guncelFiyat) / girisFiyati;
                    let pnlDolar = marjin * kaldiracSayi * fiyatFarkiOrani;
                    let pnlYuzde = fiyatFarkiOrani * kaldiracSayi * 100;

                    const fiyatEl = document.getElementById('canli-fiyat');
                    const pnlEl = document.getElementById('canli-pnl');
                    const yuzdeEl = document.getElementById('canli-yuzde');
                    const slEl = document.getElementById('ai-sl');
                    const tpEl = document.getElementById('ai-tp');

                    if(fiyatEl) fiyatEl.innerText = `$${guncelFiyat >= 1 ? guncelFiyat.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) : guncelFiyat.toFixed(6)}`;
                    
                    if(pnlEl && yuzdeEl) {
                        const isProfit = pnlDolar >= 0;
                        const renkHex = isProfit ? '#00ffcc' : '#EF4444';
                        
                        pnlEl.style.color = renkHex;
                        pnlEl.style.textShadow = `0 0 15px ${isProfit ? 'rgba(0,255,204,0.3)' : 'rgba(239,68,68,0.3)'}`;
                        yuzdeEl.style.color = renkHex;
                        
                        pnlEl.innerText = `${isProfit ? '+' : ''}$${pnlDolar.toFixed(2)}`;
                        yuzdeEl.innerText = `${isProfit ? '+' : ''}${pnlYuzde.toFixed(2)}%`;
                    }

                    if(slEl && tpEl) {
                        let slFiyat, tpFiyat;
                        if(poz.yon === 'LONG') {
                            slFiyat = guncelFiyat * (1 - (0.04 / kaldiracSayi)); 
                            tpFiyat = guncelFiyat * (1 + (0.08 / kaldiracSayi));
                        } else {
                            slFiyat = guncelFiyat * (1 + (0.04 / kaldiracSayi));
                            tpFiyat = guncelFiyat * (1 - (0.08 / kaldiracSayi));
                        }
                        slEl.innerText = `$${slFiyat >= 1 ? slFiyat.toFixed(2) : slFiyat.toFixed(6)}`;
                        tpEl.innerText = `$${tpFiyat >= 1 ? tpFiyat.toFixed(2) : tpFiyat.toFixed(6)}`;
                    }

                } catch(e) {}
            }

            guncelle();
            canliFiyatTimer = setInterval(guncelle, 1000);
        }

        function toggleForm() {
            const f = document.getElementById('spot-form');
            if(f.classList.contains('hidden')) { f.classList.remove('hidden'); f.classList.add('fade-in'); } 
            else { f.classList.add('hidden'); }
        }

        async function spotEkle() {
            const borsa = document.getElementById('f-borsa').value;
            const bakiye = document.getElementById('f-bakiye').value;
            const detay = document.getElementById('f-detay').value;
            if(!bakiye) return showToast('Lütfen miktar girin!', 'error');

            await fetch('/api/cuzdan/spot', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({borsa, bakiye, detay})
            });
            showToast('Rezerv Ağa Eklendi', 'success');
            render();
        }

        async function spotSil(index) {
            await fetch(`/api/cuzdan/spot/${index}`, {method: 'DELETE'});
            showToast('Kayıt Ağdan Silindi', 'error');
            render();
        }

        async function vadeliEkle() {
            const coin = document.getElementById('v-coin').value;
            const kaldirac = document.getElementById('v-kaldirac').value;
            const yon = document.getElementById('v-yon').value;
            const miktar = document.getElementById('v-miktar').value;
            if(!coin || !miktar) return showToast('Veri eksik!', 'error');

            await fetch('/api/cuzdan/vadeli', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({coin, kaldirac, yon, miktar})
            });
            showToast('HFT Emir İletildi', 'success');
            render();
        }

        async function vadeliSil(index) {
            if(canliFiyatTimer) clearInterval(canliFiyatTimer);
            await fetch(`/api/cuzdan/vadeli/${index}`, {method: 'DELETE'});
            showToast('Pozisyon Kapatıldı', 'error');
            aktifSayfa = 'vadeli';
            render();
        }

        render();
    </script>
