<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinyal Abonelik Ağı | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; margin: 0; overflow-x: hidden; }
        .crypto-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%); z-index: 0; pointer-events: none; }
        .dot-grid { position: fixed; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 24px 24px; z-index: 1; pointer-events: none; }
        .glass-panel { background: rgba(10, 15, 26, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        .pro-input { background: rgba(3,4,7,0.6); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; padding: 1rem; width: 100%; outline: none; transition: all 0.3s ease; }
        .pro-input:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.15); }
        .cyber-btn { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .cyber-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -10px rgba(59,130,246,0.4); }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: white; animation: slideIn 0.3s ease forwards; backdrop-filter: blur(10px); }
        .toast-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10B981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .toast-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #EF4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">
    <div class="crypto-bg"></div>
    <div class="dot-grid"></div>
    <div id="toast-container"></div>

    <div class="w-full max-w-[1100px] flex flex-col h-[90vh] z-10">
        
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10 shrink-0">
            <a href="/pano" class="text-gray-400 hover:text-blue-400 transition-colors text-xs font-black flex items-center gap-2 uppercase tracking-widest">
                <span class="text-lg">←</span> ANA PANO
            </a>
            <h1 class="text-2xl font-black tracking-widest text-white drop-shadow-md">📡 SİNYAL <span class="text-blue-400">ABONELİK AĞI</span></h1>
        </div>

        <!-- İstatistikler -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="glass-panel p-6 border-blue-500/20 bg-blue-500/5 text-center">
                <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest block mb-1">Aktif Aboneler</span>
                <span class="text-3xl font-black text-white drop-shadow-md">142</span>
            </div>
            <div class="glass-panel p-6 border-green-500/20 bg-green-500/5 text-center">
                <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest block mb-1">Aylık Tahmini Gelir</span>
                <span class="text-3xl font-black text-green-400 drop-shadow-md">$7,100</span>
            </div>
            <div class="glass-panel p-6 border-purple-500/20 bg-purple-500/5 text-center">
                <span class="text-gray-400 text-[10px] font-bold uppercase tracking-widest block mb-1">Aktif Webhooklar</span>
                <span class="text-3xl font-black text-purple-400 drop-shadow-md" id="webhook-count">0</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow overflow-hidden">
            <!-- Webhook Ekleme Formu -->
            <div class="glass-panel p-6 flex flex-col gap-6 lg:col-span-1 border-blue-500/30">
                <div class="flex items-center gap-3 border-b border-white/5 pb-3">
                    <span class="text-2xl">🔗</span>
                    <h2 class="text-blue-400 font-black text-xs tracking-widest uppercase">Yeni Dağıtım Ağı Ekle</h2>
                </div>

                <div>
                    <label class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1.5 block">Platform</label>
                    <select id="w-platform" class="pro-input font-bold text-sm">
                        <option value="Discord">🎮 Discord VIP Odası</option>
                        <option value="Telegram">✈️ Telegram Premium Kanalı</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-1.5 block">Webhook URL</label>
                    <input type="text" id="w-url" placeholder="https://discord.com/api/webhooks/..." class="pro-input font-bold text-xs text-blue-400">
                </div>

                <div class="mt-auto pt-4 flex flex-col gap-3">
                    <button onclick="testWebhook()" class="w-full bg-gray-500/10 hover:bg-gray-500/30 border border-gray-500/50 text-gray-300 font-black py-3 rounded-xl text-xs tracking-widest uppercase transition-all">
                        Bağlantıyı Test Et
                    </button>
                    <button onclick="webhookEkle()" class="cyber-btn w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-black py-4 rounded-xl text-xs tracking-widest uppercase shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                        Ağı Sisteme Kaydet
                    </button>
                </div>
            </div>

            <!-- Webhook Listesi -->
            <div class="glass-panel p-6 flex flex-col overflow-hidden lg:col-span-2">
                <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-3 shrink-0">
                    <h2 class="text-white font-black text-sm tracking-widest uppercase flex items-center gap-2">🌐 Aktif Dağıtım Kanalları</h2>
                </div>
                
                <div id="webhook-listesi" class="overflow-y-auto flex-grow pr-2 flex flex-col gap-4">
                    <div class="flex flex-col items-center justify-center h-full opacity-50">
                        <span class="text-gray-400 font-black tracking-widest text-xs uppercase">Kanal Bulunamadı</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        async function webhookLariGetir() {
            try {
                const res = await fetch('/api/webhook');
                const data = await res.json();
                
                document.getElementById('webhook-count').innerText = data.length;
                
                if (data.length === 0) {
                    document.getElementById('webhook-listesi').innerHTML = `<div class="flex flex-col items-center justify-center h-full opacity-50"><span class="text-gray-400 font-black tracking-widest text-xs uppercase">Kanal Bulunamadı</span></div>`;
                    return;
                }

                let html = '';
                data.forEach(item => {
                    const icon = item.platform === 'Discord' ? '🎮' : '✈️';
                    html += `
                        <div class="bg-[#05070A] p-4 rounded-xl border border-white/5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <span class="text-2xl">${icon}</span>
                                <div>
                                    <h3 class="text-white font-black text-sm tracking-wide">${item.platform} Premium Ağı</h3>
                                    <p class="text-blue-400 text-[10px] font-bold truncate max-w-[200px] md:max-w-[300px]">${item.url}</p>
                                </div>
                            </div>
                            <span class="px-3 py-1 bg-green-500/10 border border-green-500/30 text-green-400 rounded text-[10px] font-black uppercase tracking-widest">AKTİF</span>
                        </div>
                    `;
                });
                document.getElementById('webhook-listesi').innerHTML = html;
            } catch (error) {
                console.error(error);
            }
        }

        async function webhookEkle() {
            const platform = document.getElementById('w-platform').value;
            const url = document.getElementById('w-url').value;

            if(!url.includes('http')) return showToast("Geçerli bir URL girin!", "error");

            try {
                const res = await fetch('/api/webhook', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ platform, url })
                });
                
                if(res.ok) {
                    showToast("Dağıtım Ağı Başarıyla Eklendi!", "success");
                    document.getElementById('w-url').value = '';
                    webhookLariGetir();
                }
            } catch(e) {
                showToast("Sunucu Hatası", "error");
            }
        }

        async function testWebhook() {
            const url = document.getElementById('w-url').value;
            if(!url.includes('http')) return showToast("Test için geçerli bir URL girin!", "error");

            try {
                const res = await fetch('/api/webhook/test', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url })
                });
                
                if(res.ok) {
                    showToast("Test sinyali başarıyla iletildi!", "success");
                } else {
                    showToast("Test başarısız oldu, URL'yi kontrol edin.", "error");
                }
            } catch(e) {
                showToast("Bağlantı kurulamadı.", "error");
            }
        }

        webhookLariGetir();
    </script>
</body>
</html>
