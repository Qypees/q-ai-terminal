<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitraj Radarı | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; margin: 0; overflow-x: hidden; }
        .crypto-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%); z-index: 0; pointer-events: none; }
        .dot-grid { position: fixed; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 24px 24px; z-index: 1; pointer-events: none; }
        .glass-panel { background: rgba(10, 15, 26, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        
        .radar-scan {
            position: relative;
            overflow: hidden;
        }
        .radar-scan::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(139, 92, 246, 0.3) 100%);
            animation: radarSpin 4s linear infinite;
            z-index: 0; pointer-events: none;
        }
        @keyframes radarSpin { 100% { transform: rotate(360deg); } }

        .list-item { background: rgba(5, 7, 12, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; transition: all 0.3s ease; position: relative; z-index: 1; }
        .list-item:hover { background: rgba(15, 22, 35, 0.8); border-color: rgba(139, 92, 246, 0.3); transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.2); }
        
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">
    <div class="crypto-bg"></div>
    <div class="dot-grid"></div>

    <div class="w-full max-w-[1200px] flex flex-col h-[90vh] z-10">
        
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-white/10 shrink-0">
            <a href="/pano" class="text-gray-400 hover:text-purple-400 transition-colors text-xs font-black flex items-center gap-2 uppercase tracking-widest">
                <span class="text-lg">←</span> ANA PANO
            </a>
            <h1 class="text-2xl font-black tracking-widest text-white drop-shadow-md">⚖️ ARBİTRAJ <span class="text-purple-400">AĞI</span></h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 flex-grow overflow-hidden">
            <!-- Sol Panel: Radar ve İstatistik -->
            <div class="glass-panel p-6 flex flex-col gap-6 lg:col-span-1 border-purple-500/20">
                <div class="radar-scan bg-[#05070A] rounded-full w-48 h-48 mx-auto border-4 border-purple-500/20 flex items-center justify-center shadow-[0_0_30px_rgba(139,92,246,0.15)] relative">
                    <div class="absolute inset-2 rounded-full border border-purple-500/10"></div>
                    <div class="absolute inset-8 rounded-full border border-purple-500/10"></div>
                    <div class="text-4xl relative z-10 drop-shadow-[0_0_10px_rgba(139,92,246,0.5)]">📡</div>
                </div>
                
                <div class="text-center mt-2">
                    <h2 class="text-purple-400 font-black text-sm tracking-widest uppercase mb-1">Global CEX/DEX Taraması</h2>
                    <p class="text-gray-400 text-xs font-medium">Borsalar arası fiyat farkları saniyelik analiz ediliyor.</p>
                </div>

                <div class="mt-auto grid grid-cols-2 gap-4">
                    <div class="bg-[#05070A] p-3 rounded-xl border border-white/5 text-center">
                        <span class="text-gray-500 text-[9px] font-bold uppercase tracking-widest block mb-1">Bulunan Fırsat</span>
                        <span class="text-white font-black text-xl" id="firsat-sayisi">0</span>
                    </div>
                    <div class="bg-[#05070A] p-3 rounded-xl border border-white/5 text-center">
                        <span class="text-gray-500 text-[9px] font-bold uppercase tracking-widest block mb-1">Ort. Spread</span>
                        <span class="text-green-400 font-black text-xl">%1.2</span>
                    </div>
                </div>
            </div>

            <!-- Sağ Panel: Fırsat Listesi -->
            <div class="glass-panel p-6 flex flex-col overflow-hidden lg:col-span-3">
                <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-3 shrink-0">
                    <h2 class="text-white font-black text-sm tracking-widest uppercase flex items-center gap-2">🔄 Aktif Arbitraj Kanalları</h2>
                    <div class="flex items-center gap-2">
                        <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-purple-500"></span></span>
                        <span class="text-purple-400 text-[10px] font-black uppercase tracking-widest">Canlı Akış</span>
                    </div>
                </div>
                
                <div id="arbitraj-listesi" class="overflow-y-auto flex-grow pr-2 flex flex-col gap-4">
                    <div class="flex flex-col items-center justify-center h-full opacity-50">
                        <div class="w-10 h-10 border-4 border-t-purple-500 border-transparent rounded-full animate-spin mb-4"></div>
                        <span class="text-gray-400 font-black tracking-widest text-xs uppercase">Borsalar Taranıyor...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function arbitrajGetir() {
            try {
                const res = await fetch('/api/arbitraj');
                const data = await res.json();
                
                document.getElementById('firsat-sayisi').innerText = data.length;
                
                let html = '';
                data.forEach(item => {
                    html += `
                        <div class="list-item p-5 border-l-4" style="border-left-color: ${item.color}">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                
                                <div class="flex items-center gap-4 w-full md:w-1/3">
                                    <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center p-2 shrink-0">
                                        <img src="https://assets.coincap.io/assets/icons/${item.coin.toLowerCase()}@2x.png" onerror="this.src='https://assets.coincap.io/assets/icons/btc@2x.png'" class="w-full h-full object-contain">
                                    </div>
                                    <div>
                                        <h3 class="text-xl font-black text-white tracking-widest">${item.coin}</h3>
                                        <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase tracking-widest border" style="color:${item.color}; border-color:${item.color}40; background:${item.color}10;">${item.status}</span>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between md:justify-center w-full md:w-1/3 gap-4 bg-[#020203]/50 p-3 rounded-lg border border-white/5">
                                    <div class="text-left">
                                        <span class="text-red-400 text-[10px] font-bold uppercase block mb-1">Al (${item.buy_exchange})</span>
                                        <span class="text-white font-black">$${item.buy_price}</span>
                                    </div>
                                    <span class="text-gray-500 text-lg">➔</span>
                                    <div class="text-right">
                                        <span class="text-green-400 text-[10px] font-bold uppercase block mb-1">Sat (${item.sell_exchange})</span>
                                        <span class="text-white font-black">$${item.sell_price}</span>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between md:justify-end w-full md:w-1/3 gap-6">
                                    <div class="text-right">
                                        <span class="text-gray-500 text-[9px] font-bold uppercase tracking-widest block mb-1">Fiyat Farkı (Spread)</span>
                                        <span class="text-purple-400 font-black text-lg">%${item.spread}</span>
                                    </div>
                                    <button class="bg-purple-500/10 hover:bg-purple-500 border border-purple-500/50 text-purple-400 hover:text-white transition-all px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-[0_0_10px_rgba(139,92,246,0.2)]">
                                        İşle
                                    </button>
                                </div>
                                
                            </div>
                        </div>
                    `;
                });
                document.getElementById('arbitraj-listesi').innerHTML = html;
            } catch (error) {
                console.error("Tarama hatası:", error);
            }
        }

        arbitrajGetir();
        setInterval(arbitrajGetir, 8000);
    </script>
</body>
</html>
