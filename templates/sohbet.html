<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-AI Asistan | Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; margin: 0; }
        .crypto-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%); z-index: 0; }
        .glass-panel { background: rgba(10, 15, 26, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; z-index: 10; position: relative;}
        .msg-bot { background: rgba(0,255,204,0.05); border: 1px solid rgba(0,255,204,0.2); color: #e2e8f0; }
        .msg-user { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); color: white; text-align: right; margin-left: auto; }
        .pro-input { background: rgba(3,4,7,0.6); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; padding: 1rem; width: 100%; outline: none; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">
    <div class="crypto-bg"></div>
    <div class="w-full max-w-[900px] flex flex-col h-[90vh]">
        <div class="flex items-center justify-between mb-4 pb-4 border-b border-white/10 z-10 shrink-0">
            <a href="/pano" class="text-gray-400 hover:text-[#00ffcc] text-xs font-black uppercase">← ANA PANO</a>
            <h1 class="text-2xl font-black tracking-widest text-white">💬 Q-AI <span class="text-[#00ffcc]">ASİSTAN</span></h1>
        </div>
        
        <div class="glass-panel flex-grow flex flex-col p-6 overflow-hidden">
            <div id="chat-box" class="flex-grow overflow-y-auto flex flex-col gap-4 pr-2 mb-4">
                <div class="msg-bot p-4 rounded-xl w-[85%] leading-relaxed text-sm">
                    <span class="text-[#00ffcc] font-black text-[10px] uppercase block mb-1">Q-AI Konseyi</span>
                    Selam Patron! Teknik Analiz, Makro Ekonomi ve Risk Yönetimi modüllerim devrede. Hangi coini analiz etmemi istersin?
                </div>
            </div>
            
            <div class="flex gap-3 shrink-0">
                <input type="text" id="mesaj-input" placeholder="Örn: Solana'nın (SOL) güncel durumu nedir? Long açılır mı?" class="pro-input flex-grow" onkeypress="if(event.key === 'Enter') gonder()">
                <button onclick="gonder()" class="bg-[#00ffcc] hover:bg-white text-black font-black px-8 rounded-xl text-xs uppercase tracking-widest transition-colors">Sor</button>
            </div>
        </div>
    </div>
    <script>
        async function gonder() {
            const input = document.getElementById('mesaj-input');
            const mesaj = input.value;
            if(!mesaj) return;
            
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="msg-user p-4 rounded-xl w-[85%] text-sm">${mesaj}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            
            const loadingId = 'load-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="msg-bot p-4 rounded-xl w-[85%] text-sm animate-pulse">Üçlü Konsey (Teknik, Risk, Makro) verileri analiz ediyor...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            const res = await fetch('/api/sohbet', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({mesaj: mesaj}) });
            const data = await res.json();
            
            document.getElementById(loadingId).remove();
            // Markdown bold temizliği (opsiyonel)
            let yanit = data.yanit.replace(/\*\*(.*?)\*\*/g, '<span class="font-black text-white">$1</span>');
            
            chatBox.innerHTML += `<div class="msg-bot p-4 rounded-xl w-[85%] leading-relaxed text-sm"><span class="text-[#00ffcc] font-black text-[10px] uppercase block mb-1">Q-AI Konseyi</span>${yanit}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
