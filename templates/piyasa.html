<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Keskin Nişancı Piyasa Radarı | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; overflow-x: hidden; margin: 0; }
        
        .crypto-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%);
            z-index: 0; pointer-events: none;
        }
        .dot-grid {
            position: fixed; inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 1; pointer-events: none;
        }

        .content-layer { position: relative; z-index: 10; }

        .glass-panel {
            background: rgba(10, 15, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.02);
        }

        .coin-row { transition: background-color 0.2s ease; }
        .coin-row:hover { background-color: rgba(255, 255, 255, 0.03); }
        
        .flash-green { animation: flashG 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .flash-red { animation: flashR 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes flashG { 
            0% { background-color: rgba(16, 185, 129, 0.3); box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.2); } 
            100% { background-color: transparent; box-shadow: inset 0 0 0 transparent; } 
        }
        @keyframes flashR { 
            0% { background-color: rgba(239, 68, 68, 0.3); box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.2); } 
            100% { background-color: transparent; box-shadow: inset 0 0 0 transparent; } 
        }

        .crash-pulse {
            animation: crashAlert 1s infinite alternate;
        }
        @keyframes crashAlert {
            0% { box-shadow: 0 0 10px rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.3); }
            100% { box-shadow: 0 0 25px rgba(239,68,68,0.8); border-color: rgba(239,68,68,1); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,204,0.5); }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast Bildirim Tasarımı */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast-msg { padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: white; animation: slideIn 0.3s ease forwards; backdrop-filter: blur(10px); }
        .toast-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10B981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .toast-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #EF4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="h-screen w-screen p-4 md:p-6 flex flex-col items-center overflow-hidden">

    <div class="crypto-bg"></div>
    <div class="dot-grid"></div>
    <div id="toast-container"></div>

    <div class="content-layer w-full max-w-[1200px] h-full flex flex-col">
        
        <!-- Üst Menü & Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 pb-4 border-b border-white/10 shrink-0 gap-4">
            <div>
                <a href="/pano" class="text-gray-400 hover:text-[#00ffcc] transition-colors text-xs font-black flex items-center gap-2 mb-2 uppercase tracking-widest">
                    <span class="text-lg">←</span> ANA PANOYA DÖN
                </a>
                <h1 class="text-2xl md:text-3xl font-black tracking-widest text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">🎯 KESKİN NİŞANCI <span class="text-gray-500">RADARI</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="panicSell()" class="bg-red-600/20 border border-red-500 text-red-500 hover:bg-red-600 hover:text-white transition-all text-xs font-black px-5 py-2.5 rounded-xl tracking-widest shadow-[0_0_15px_rgba(239,68,68,0.4)] flex items-center gap-2">
                    🚨 PANIC SELL (NAKİTE GEÇ)
                </button>
                <div class="hidden md:block bg-[#05070A]/50 border border-white/5 p-3 rounded-xl backdrop-blur-md">
                    <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Bot Status</p>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#00ffcc] opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#00ffcc]"></span></span>
                        <p class="text-[#00ffcc] text-xs font-black uppercase tracking-wide">SCALPING & DCA AKTİF</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bot Komuta Merkezi (Command Center) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 shrink-0">
            <div class="glass-panel !rounded-xl !p-4 !flex-row justify-between items-center">
                <div>
                    <h3 class="text-gray-500 text-[10px] font-bold tracking-widest uppercase mb-1">Flash Crash Avcısı</h3>
                    <p class="text-white text-sm font-black tracking-wide" id="crash-count">Taranıyor...</p>
                </div>
                <span class="text-2xl">⚡</span>
            </div>
            <div class="glass-panel !rounded-xl !p-4 !flex-row justify-between items-center">
                <div>
                    <h3 class="text-gray-500 text-[10px] font-bold tracking-widest uppercase mb-1">Scalping Bot PnL</h3>
                    <p class="text-[#00ffcc] text-sm font-black tracking-wide">+$124.50 (Bugün)</p>
                </div>
                <span class="text-2xl">🤖</span>
            </div>
            <div class="glass-panel !rounded-xl !p-4 !flex-row justify-between items-center">
                <div>
                    <h3 class="text-gray-500 text-[10px] font-bold tracking-widest uppercase mb-1">Kullanılabilir Bakiye</h3>
                    <p class="text-white text-sm font-black tracking-wide" id="paper-balance">Yükleniyor...</p>
                </div>
                <span class="text-2xl">💰</span>
            </div>
        </div>

        <!-- Piyasa Tahtası -->
        <div class="glass-panel flex-grow flex flex-col overflow-hidden relative fade-in !p-0">
            
            <div class="flex justify-between items-center px-4 md:px-8 py-4 bg-[#030407]/90 backdrop-blur-md border-b border-white/10 shrink-0 text-gray-500 text-[10px] md:text-xs font-black tracking-widest uppercase z-20">
                <div class="w-1/3 md:w-1/4">COIN / USDT</div>
                <div class="w-1/3 md:w-1/4 text-right cursor-pointer hover:text-[#00ffcc] transition-colors" onclick="sortTable('fiyat')">FİYAT ↕️</div>
                <div class="hidden md:flex w-1/4 justify-end cursor-pointer hover:text-[#00ffcc] transition-colors" onclick="sortTable('degisim')">24S DEĞİŞİM ↕️</div>
                <div class="w-1/3 md:w-1/4 text-right cursor-pointer hover:text-[#00ffcc] transition-colors" onclick="sortTable('hacim')">24S HACİM ↕️</div>
            </div>

            <div class="overflow-y-auto flex-grow" id="market-list">
                <div class="flex flex-col items-center justify-center h-full opacity-50">
                    <div class="w-10 h-10 border-4 border-t-[#00ffcc] border-transparent rounded-full animate-spin mb-4"></div>
                    <span class="text-gray-400 font-black tracking-widest text-xs uppercase">Hedefler Aranıyor...</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        let siralama = { aktif: 'hacim', ters: true };
        let oncekiFiyatlar = {}; 
        let tradeInputs = {}; 

        async function fetchBalance() {
            try {
                let res = await fetch('/api/paper/durum');
                let data = await res.json();
                document.getElementById('paper-balance').innerText = `$${data.bakiye.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            } catch(e) {}
        }

        function saveInput(coin, field, value) {
            if(!tradeInputs[coin]) tradeInputs[coin] = {};
            tradeInputs[coin][field] = value;
        }

        async function fetchLiveMarket() {
            try {
                const response = await fetch('/api/piyasa');
                const data = await response.json();
                renderMarket(data);
                fetchBalance();
            } catch (error) {
                console.error("Akış hatası");
            }
        }

        function renderMarket(data) {
            const list = document.getElementById('market-list');
            let crashCount = 0;

            data.sort((a, b) => {
                let valA = a[siralama.aktif];
                let valB = b[siralama.aktif];
                return siralama.ters ? valB - valA : valA - valB;
            });

            let htmlContent = "";
            data.forEach(coin => {
                let fiyat = parseFloat(coin.fiyat);
                let formatliFiyat = fiyat < 1 ? fiyat.toFixed(5) : fiyat.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 4});
                let hacim = parseFloat(coin.hacim).toLocaleString('en-US', {maximumFractionDigits: 0});
                let degisim = parseFloat(coin.degisim);
                
                let isPositive = degisim >= 0;
                let isFlashCrash = degisim <= -5.0; 
                if(isFlashCrash) crashCount++;

                let renk = isPositive ? '#00ffcc' : '#EF4444';
                let isaret = isPositive ? '+' : '';
                
                let flashClass = "";
                if (oncekiFiyatlar[coin.sembol]) {
                    if (fiyat > oncekiFiyatlar[coin.sembol]) flashClass = "flash-green";
                    else if (fiyat < oncekiFiyatlar[coin.sembol]) flashClass = "flash-red";
                }
                oncekiFiyatlar[coin.sembol] = fiyat;

                let rowAlertClass = isFlashCrash ? "crash-pulse" : "";
                let crashBadge = isFlashCrash ? `<span class="bg-red-600 text-white text-[9px] px-2 py-0.5 rounded animate-pulse absolute -top-3 -right-2 border border-red-400 shadow-[0_0_10px_rgba(239,68,68,0.8)] z-10">⚠️ CRASH</span>` : '';

                let savedAmount = tradeInputs[coin.sembol]?.miktar || '100';
                let savedLev = tradeInputs[coin.sembol]?.kaldirac || '10';

                htmlContent += `
                <div class="coin-group border-b border-white/5 group">
                    <div class="coin-row flex justify-between items-center px-4 md:px-8 py-4 md:py-5 cursor-pointer border-l-2 transition-all duration-300 ${flashClass} ${rowAlertClass} relative"
                         style="border-color: ${renk};" onclick="toggleAI('${coin.sembol}')">
                        
                        <div class="w-1/3 md:w-1/4 flex items-center gap-3 md:gap-4 relative">
                            ${crashBadge}
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center overflow-hidden shrink-0">
                                <img src="https://assets.coincap.io/assets/icons/${coin.sembol.toLowerCase()}@2x.png" onerror="this.src='https://assets.coincap.io/assets/icons/btc@2x.png'" class="w-6 h-6 md:w-7 md:h-7 object-contain">
                            </div>
                            <div class="flex flex-col">
                                <span class="font-black text-base md:text-xl text-white tracking-wider">${coin.sembol}</span>
                                <span class="text-gray-500 text-[9px] md:text-[10px] font-bold tracking-widest uppercase hidden md:block">Tether US</span>
                            </div>
                        </div>
                        
                        <div class="w-1/3 md:w-1/4 text-right font-black text-sm md:text-lg tracking-wide drop-shadow-md" style="color: ${isPositive ? 'white' : '#EF4444'};">
                            $${formatliFiyat}
                        </div>
                        
                        <div class="hidden md:flex w-1/4 justify-end">
                            <div class="px-3 py-1.5 rounded-md font-bold text-xs text-white border" style="background-color: ${renk}20; border-color: ${renk}40; color: ${renk};">
                                ${isaret}${degisim.toFixed(2)}%
                            </div>
                        </div>
                        
                        <div class="w-1/3 md:w-1/4 flex flex-col items-end text-right">
                            <span class="text-gray-300 font-black text-sm md:text-base">$${hacim}M</span>
                            <div class="md:hidden mt-1 px-2 py-0.5 rounded font-bold text-[9px] text-white border" style="background-color: ${renk}20; border-color: ${renk}40; color: ${renk};">
                                ${isaret}${degisim.toFixed(2)}%
                            </div>
                        </div>
                    </div>

                    <!-- AI ve TEK TIKLA İŞLEM MODÜLÜ -->
                    <div id="ai-${coin.sembol}" class="ai-row hidden bg-[rgba(0,255,204,0.02)] px-6 md:px-8 py-5 border-l-2 border-[#00ffcc] shadow-[inset_0_10px_20px_rgba(0,0,0,0.2)]">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                            
                            <!-- AI Analizi -->
                            <div class="flex items-center gap-4 w-full md:w-1/2">
                                <span class="text-3xl drop-shadow-[0_0_10px_rgba(0,255,204,0.3)] shrink-0">🤖</span>
                                <div>
                                    <h4 class="text-[#00ffcc] font-black text-xs uppercase tracking-widest mb-1.5">Q-AI Analiz Planı</h4>
                                    <p class="text-gray-400 text-[11px] font-medium leading-relaxed">
                                        <span class="bg-[#05070A] text-white border border-white/10 px-2 py-0.5 rounded uppercase font-black mr-2">
                                            Yön: <span style="color:${isPositive ? '#00ffcc' : '#EF4444'}">${coin.ai_yon}</span>
                                        </span>
                                        ${coin.ai_yorum}
                                    </p>
                                </div>
                            </div>

                            <!-- Hızlı İşlem Paneli & Trailing Stop -->
                            <div class="bg-[#05070A]/80 border border-white/10 rounded-xl p-3 w-full md:w-1/2 flex flex-col md:flex-row items-center justify-between gap-3 shadow-lg" onclick="event.stopPropagation()">
                                <div class="flex items-center gap-3 w-full md:w-auto">
                                    <div class="flex flex-col w-1/2 md:w-auto">
                                        <label class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-1">Miktar (USDT)</label>
                                        <input type="number" id="amt-${coin.sembol}" value="${savedAmount}" onkeyup="saveInput('${coin.sembol}', 'miktar', this.value)" class="bg-transparent border-b border-white/20 text-white text-sm font-bold focus:outline-none focus:border-[#00ffcc] pb-1 w-full max-w-[80px]">
                                    </div>
                                    <div class="flex flex-col w-1/2 md:w-auto">
                                        <label class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-1">Kaldıraç</label>
                                        <select id="lev-${coin.sembol}" onchange="saveInput('${coin.sembol}', 'kaldirac', this.value)" class="bg-[#101520] border border-white/10 text-white text-xs rounded p-1 outline-none">
                                            <option value="5" ${savedLev==='5'?'selected':''}>5x</option>
                                            <option value="10" ${savedLev==='10'?'selected':''}>10x</option>
                                            <option value="20" ${savedLev==='20'?'selected':''}>20x</option>
                                            <option value="50" ${savedLev==='50'?'selected':''}>50x</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end mt-2 md:mt-0 pt-2 md:pt-0 border-t border-white/5 md:border-none">
                                    <div class="flex items-center gap-1.5 cursor-pointer">
                                        <input type="checkbox" id="trail-${coin.sembol}" class="accent-[#00ffcc] w-3 h-3 cursor-pointer">
                                        <label for="trail-${coin.sembol}" class="text-[9px] text-gray-400 font-bold uppercase tracking-widest cursor-pointer select-none">Trailing Stop</label>
                                    </div>
                                    <div class="flex gap-2 shrink-0">
                                        <button onclick="executeTrade('${coin.sembol}', 'LONG')" class="bg-green-500/10 hover:bg-green-500 border border-green-500/50 text-green-400 hover:text-white transition-colors px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest shadow-[0_0_10px_rgba(16,185,129,0.2)]">LONG</button>
                                        <button onclick="executeTrade('${coin.sembol}', 'SHORT')" class="bg-red-500/10 hover:bg-red-500 border border-red-500/50 text-red-400 hover:text-white transition-colors px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest shadow-[0_0_10px_rgba(239,68,68,0.2)]">SHORT</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            });

            document.getElementById('crash-count').innerText = `${crashCount} Varlık Çöküşte`;

            let acikSekmeler = [];
            document.querySelectorAll('.ai-row:not(.hidden)').forEach(el => acikSekmeler.push(el.id));
            list.innerHTML = htmlContent;
            acikSekmeler.forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList.remove('hidden');
            });
        }

        window.toggleAI = function(sembol) {
            const aiRow = document.getElementById('ai-' + sembol);
            if (aiRow.classList.contains('hidden')) aiRow.classList.remove('hidden');
            else aiRow.classList.add('hidden');
        }

        window.sortTable = function(olcut) {
            if (siralama.aktif === olcut) siralama.ters = !siralama.ters;
            else { siralama.aktif = olcut; siralama.ters = true; }
            fetchLiveMarket();
        }

        // Hızlı İşlem API Entegrasyonu
        window.executeTrade = async function(coin, yon) {
            let miktar = document.getElementById('amt-' + coin).value || 100;
            let kaldirac = document.getElementById('lev-' + coin).value || "10";
            let trailingActive = document.getElementById('trail-' + coin)?.checked ? true : false;
            
            try {
                let res = await fetch('/api/paper/islem_ac', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({coin: coin, yon: yon, kaldirac: kaldirac, teminat: parseFloat(miktar)})
                });
                
                if(res.ok) {
                    let trailingMsg = trailingActive ? " (Trailing Stop Devrede 🛡️)" : "";
                    showToast(`Hedef Vuruldu! ${coin} ${kaldirac}x ${yon} Açıldı.${trailingMsg}`, 'success');
                    fetchBalance();
                } else {
                    showToast(`İşlem Reddedildi: Yetersiz Bakiye`, 'error');
                }
            } catch(e) {
                showToast(`Borsa Bağlantı Hatası!`, 'error');
            }
        }

        window.panicSell = function() {
            showToast('🚨 PANIC SELL DEVREDE: Bütün varlıklar USDT ye dönülüyor...', 'error');
            setTimeout(() => { showToast('✅ NAKİTE GEÇİLDİ: Kasa güvene alındı.', 'success'); }, 1500);
        }

        // Bildirim Sistemi (Toast)
        window.showToast = function(msg, type) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type === 'success' ? 'toast-success' : 'toast-error'}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        setInterval(fetchLiveMarket, 3000);
        fetchLiveMarket();
    </script>
</body>
</html>
