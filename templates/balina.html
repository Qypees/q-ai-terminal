<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balina Radarı | Q-AI Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; margin: 0; }
        .crypto-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%); z-index: 0; }
        .glass-panel { background: rgba(10, 15, 26, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; position: relative; z-index: 10;}
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">
    <div class="crypto-bg"></div>
    <div class="w-full max-w-[1000px] flex flex-col h-[90vh]">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10 z-10">
            <a href="/pano" class="text-gray-400 hover:text-blue-400 text-xs font-black uppercase">← ANA PANO</a>
            <h1 class="text-2xl font-black tracking-widest text-white">🐋 BALİNA <span class="text-blue-500">RADARI</span></h1>
        </div>
        <div class="glass-panel p-6 flex-grow overflow-y-auto">
            <div class="flex items-center gap-2 mb-6 border-b border-white/10 pb-4">
                <span class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></span>
                <span class="text-blue-400 font-black tracking-widest text-xs uppercase">Zincir-Üstü (On-Chain) Tarama Aktif</span>
            </div>
            <div id="balina-liste" class="flex flex-col gap-4"></div>
        </div>
    </div>
    <script>
        async function fetchBalina() {
            const res = await fetch('/api/balina_akimlari');
            const data = await res.json();
            document.getElementById('balina-liste').innerHTML = data.map(b => `
                <div class="p-5 bg-[#05070A] border-l-4 rounded-r-xl border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-4" style="border-left-color: ${b.renk}">
                    <div>
                        <span class="text-gray-500 text-[10px] font-bold tracking-widest uppercase block mb-1">${b.zaman}</span>
                        <p class="text-white font-medium text-sm md:text-base">${b.detay}</p>
                    </div>
                    <span class="px-3 py-1 rounded text-[10px] font-black uppercase tracking-widest border" style="color:${b.renk}; border-color:${b.renk}40; background:${b.renk}10;">${b.yon}</span>
                </div>
            `).join('');
        }
        fetchBalina(); setInterval(fetchBalina, 15000);
    </script>
</body>
</html>
