<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI İşlem Günlüğü | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; margin: 0; }
        .crypto-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%); z-index: 0; }
        .glass-panel { background: rgba(10, 15, 26, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 20px; box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5); position: relative; z-index: 10;}
        .pro-input { background: rgba(3,4,7,0.6); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 12px; padding: 1rem; width: 100%; outline: none; }
        .pro-input:focus { border-color: #00ffcc; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">
    <div class="crypto-bg"></div>
    <div class="w-full max-w-[1000px] flex flex-col h-[90vh]">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10 z-10">
            <a href="/pano" class="text-gray-400 hover:text-[#00ffcc] text-xs font-black uppercase">← ANA PANO</a>
            <h1 class="text-2xl font-black tracking-widest text-white">📝 AI İŞLEM <span class="text-gray-500">GÜNLÜĞÜ</span></h1>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow overflow-hidden z-10">
            <div class="md:col-span-1 glass-panel p-6 flex flex-col gap-4">
                <h2 class="text-[#00ffcc] font-black text-sm tracking-widest uppercase">Plan Ekle</h2>
                <textarea id="not-icerik" rows="5" class="pro-input" placeholder="Bugün hangi hatayı yaptın? Hangi formasyonu kaçırdın? Buraya yaz..."></textarea>
                <button onclick="notEkle()" class="w-full bg-[#00ffcc]/10 hover:bg-[#00ffcc] border border-[#00ffcc]/50 text-[#00ffcc] hover:text-black font-black py-3 rounded-xl text-xs tracking-widest uppercase transition-all">Kaydet</button>
                
                <div class="mt-4 p-4 bg-red-500/10 border border-red-500/30 rounded-xl">
                    <h3 class="text-red-400 font-black text-[10px] tracking-widest uppercase mb-2">🤖 Q-AI Portföy Fırçası</h3>
                    <p class="text-gray-300 text-xs italic">"Son 3 işleminde hep erken kâr aldın. Trendi sonuna kadar izlemiyorsun. Cuma günleri yüksek kaldıraç açmayı bırakmalısın."</p>
                </div>
            </div>
            <div class="md:col-span-2 glass-panel p-6 flex flex-col overflow-hidden">
                <h2 class="text-white font-black text-sm tracking-widest uppercase mb-4">Kayıtlı Planlar</h2>
                <div id="not-listesi" class="overflow-y-auto flex-grow flex flex-col gap-3 pr-2"></div>
            </div>
        </div>
    </div>
    <script>
        async function fetchNotlar() {
            const res = await fetch('/api/notlar');
            const data = await res.json();
            const liste = document.getElementById('not-listesi');
            liste.innerHTML = data.reverse().map(n => `
                <div class="bg-[#05070A] border border-white/5 p-4 rounded-xl">
                    <span class="text-gray-500 text-[10px] font-bold block mb-1">${n.zaman}</span>
                    <p class="text-gray-200 text-sm">${n.not}</p>
                </div>
            `).join('');
        }
        async function notEkle() {
            const icerik = document.getElementById('not-icerik').value;
            if(!icerik) return;
            await fetch('/api/notlar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({not_icerigi: icerik}) });
            document.getElementById('not-icerik').value = '';
            fetchNotlar();
        }
        fetchNotlar();
    </script>
</body>
</html>
