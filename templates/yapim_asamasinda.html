<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ sayfa }} | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; overflow: hidden; margin: 0; }
        
        /* Zemin Katmanları */
        .crypto-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%);
            z-index: 0; pointer-events: none;
        }
        .dot-grid {
            position: fixed; inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 1; pointer-events: none;
        }

        .content-layer { position: relative; z-index: 10; }

        /* Neomorphic Glass Panel */
        .glass-panel {
            background: rgba(10, 15, 26, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.02);
        }

        /* Siber-Çekirdek Spinner Animasyonu */
        .core-spinner {
            position: relative;
            width: 80px; height: 80px;
            margin: 0 auto 2rem auto;
        }
        .core-spinner .ring1, .core-spinner .ring2 {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        .core-spinner .ring1 {
            border-top-color: #00ffcc;
            border-bottom-color: #00ffcc;
            animation: spin1 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
        }
        .core-spinner .ring2 {
            border-left-color: rgba(255,255,255,0.3);
            border-right-color: rgba(255,255,255,0.3);
            animation: spin2 2s linear infinite;
            inset: 10px;
        }
        @keyframes spin1 { 100% { transform: rotate(360deg); } }
        @keyframes spin2 { 100% { transform: rotate(-360deg); } }

        /* Neon Geri Dön Butonu */
        .neon-outline-btn {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .neon-outline-btn:hover {
            background: rgba(0, 255, 204, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 255, 204, 0.3);
            transform: translateY(-2px);
        }

        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6">

    <div class="crypto-bg"></div>
    <div class="dot-grid"></div>

    <div class="content-layer w-full max-w-lg text-center fade-in">
        
        <div class="glass-panel p-10 md:p-12 relative overflow-hidden">
            <!-- Arka Plan Hafif Parlaması -->
            <div class="absolute top-0 right-0 w-32 h-32 bg-[#00ffcc]/10 blur-3xl rounded-full pointer-events-none"></div>

            <!-- Siber-Çekirdek Yükleyici -->
            <div class="core-spinner">
                <div class="ring1"></div>
                <div class="ring2"></div>
                <div class="absolute inset-0 flex items-center justify-center text-xs font-black text-[#00ffcc] tracking-widest">%99</div>
            </div>
            
            <h2 class="text-xl md:text-2xl font-black tracking-widest text-white mb-2 uppercase drop-shadow-md">
                <span class="text-[#00ffcc]">{{ sayfa }}</span> MODÜLÜ
            </h2>
            <h3 class="text-[10px] font-black tracking-[0.2em] text-gray-500 uppercase mb-6">Sistem Entegrasyonu Sürüyor</h3>
            
            <div class="bg-[#030407]/60 border border-white/5 rounded-xl p-4 mb-8">
                <p class="text-gray-400 text-xs leading-relaxed font-medium">
                    Algoritmik çekirdek adaptasyonu ve veri bağlantıları sağlanıyor. Bu modül çok yakında Q-AI ağına tam senkronize olarak eklenecektir.
                </p>
            </div>
            
            <a href="/" class="neon-outline-btn block w-full py-4 rounded-xl font-black text-xs uppercase tracking-[0.15em]">
                RADARDAN ÇIK VE ANA PANOYA DÖN ➔
            </a>
        </div>

    </div>

</body>
</html>
