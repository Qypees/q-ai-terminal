<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son Dakika Haberler | Q-AI Terminal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020203; color: white; margin: 0; }
        .crypto-bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(13, 22, 37, 0.8) 0%, rgba(2, 2, 3, 0.98) 80%); z-index: 0; }
        .glass-panel { background: rgba(10, 15, 26, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; z-index: 10; position: relative; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center">
    <div class="crypto-bg"></div>
    <div class="w-full max-w-[1100px] flex flex-col h-[90vh] z-10">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/10 shrink-0">
            <a href="/pano" class="text-gray-400 hover:text-amber-400 text-xs font-black uppercase tracking-widest">← ANA PANOYA DÖN</a>
            <h1 class="text-2xl font-black tracking-widest text-white">📰 SON DAKİKA <span class="text-amber-400">PİYASA HABERLERİ</span></h1>
        </div>
        <div class="glass-panel p-6 flex-grow overflow-y-auto">
            <div id="haberler-container" class="flex flex-col gap-4">
                <div class="text-center text-gray-400 py-10 font-bold uppercase tracking-widest">Global RSS Ağlarına Bağlanılıyor...</div>
            </div>
        </div>
    </div>
    <script>
        async function haberleriYukle() {
            try {
                const res = await fetch('/api/haberler');
                const haberler = await res.json();
                const container = document.getElementById('haberler-container');
                container.innerHTML = haberler.map(h => {
                    
                    // Haber başlığı veya içeriğine göre Long/Short Duygu Tespiti
                    const metin = (h.baslik + ' ' + h.ozet).toLowerCase();
                    let etkiEtiketi = "NÖTR 🟡";
                    let etkiRenk = "color: #F59E0B; border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1);";

                    const pozitifKelimeler = ["etf", "onay", "boğa", "yükseliş", "kazanç", "rekor", "ortaklık", "alım", "devam", "büyüme", "destek", "binance", "artış"];
                    const negatifKelimeler = ["dava", "hack", "çöküş", "düşüş", "iflas", "yasak", "saldırı", "sec", "ceza", "satış", "stres", "kriz", "baskı"];

                    let posScore = pozitifKelimeler.filter(k => metin.includes(k)).length;
                    let negScore = negatifKelimeler.filter(k => metin.includes(k)).length;

                    if (posScore > negScore) {
                        etkiEtiketi = "LONG BENT 🚀 (YÜKSELİŞ BEKLENTİSİ)";
                        etkiRenk = "color: #10B981; border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.1);";
                    } else if (negScore > posScore) {
                        etkiEtiketi = "SHORT BENT 🩸 (DÜŞÜŞ BEKLENTİSİ)";
                        etkiRenk = "color: #EF4444; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1);";
                    }

                    return `
                        <div class="bg-[#05070A] border border-white/5 p-5 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-amber-400/30 transition-all">
                            <div class="flex-grow">
                                <div class="flex flex-wrap items-center gap-3 mb-2">
                                    <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded border" style="color: ${h.onem_renk}; border-color: ${h.onem_renk}40; background: ${h.onem_renk}10;">${h.onem}</span>
                                    
                                    <!-- YENİ: HABER ETKİSİ LONG / SHORT ETİKETİ -->
                                    <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded border" style="${etkiRenk}">${etkiEtiketi}</span>

                                    <span class="text-gray-500 text-xs font-bold">${h.kaynak} • ${h.zaman}</span>
                                </div>
                                <h3 class="text-white font-black text-base md:text-lg mb-1">${h.baslik}</h3>
                                <p class="text-gray-400 text-xs leading-relaxed">${h.ozet}</p>
                            </div>
                            <a href="${h.url}" target="_blank" class="shrink-0 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-black font-black px-4 py-2 rounded-lg text-xs uppercase tracking-widest transition-all border border-amber-500/30">Kaynağa Git ➔</a>
                        </div>
                    `;
                }).join('');
            } catch(e) {
                document.getElementById('haberler-container').innerHTML = '<div class="text-red-500 text-center font-bold">Haberler yüklenirken hata oluştu.</div>';
            }
        }
        haberleriYukle();
        setInterval(haberleriYukle, 30000);
    </script>
</body>
</html>
